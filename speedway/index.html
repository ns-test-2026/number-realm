<!doctype html><html><head><meta charset=utf8><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Speedway"><meta name="theme-color" content="#111827"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<meta charset="utf-8">
<title>Number Speedway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap">
<style>
/* Layout: a toy-box racing game. Hazard-yellow garage floor, cartoon cards with thick ink outlines,
   a top-down world map to steer through, and a chunky answer pad underneath. One bright look on purpose. */
:root{
  --bg:#FFD23F; --ink:#1B1B1F; --card:#FFFFFF; --muted:#4D515C;
  --blue:#2563EB; --good:#1E9E55; --oops:#E76F51; --gold:#FFD23F;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg) repeating-linear-gradient(-45deg,rgba(27,27,31,.045) 0 22px,transparent 22px 44px);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(24px,4.4vw,38px);line-height:1;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.logo .flag{width:38px;height:38px;flex:none;border:3px solid var(--ink);border-radius:8px;background:conic-gradient(var(--ink) 25%,#fff 0 50%,var(--ink) 0 75%,#fff 0) 0 0/16px 16px}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.chunk{border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:4px 4px 0 var(--ink);font-weight:800;padding:8px 14px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.chunk:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.chunk:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.chunk.go{background:#E63946;color:#fff;font-family:var(--display);font-weight:400;font-size:22px;padding:12px 24px}
.card{border:3px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:5px 5px 0 var(--ink);padding:16px;min-width:0}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px;letter-spacing:.3px}
.lbl{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px;display:block}

/* ---------- setup ---------- */
#setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:18px;align-items:start}
@media (max-width:860px){#setup{grid-template-columns:minmax(0,1fr)}}
.setcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.seg{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 12px;font-weight:800;cursor:pointer;font-size:15px}
.seg[aria-pressed="true"]{background:var(--ink);color:#fff}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.player{border:3px solid var(--ink);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:#fff;border-top-width:9px;min-width:0}
.player[data-i="0"]{border-top-color:#E63946} .player[data-i="1"]{border-top-color:#2563EB}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.75fr) minmax(0,1.6fr);gap:8px}
@media (max-width:420px){.prow{grid-template-columns:minmax(0,1fr)}}
.player input[type=text],.player select,.opts select{font:inherit;font-size:15px;font-weight:700;border:2.5px solid var(--ink);border-radius:10px;padding:5px 9px;width:100%;background:#fff;color:var(--ink)}
.vstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;min-width:0}
.vbtn{flex:0 0 82px;scroll-snap-align:start;border:2.5px solid #d5d7dd;border-radius:12px;background:#f7f8fa;padding:3px 3px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:800;line-height:1.05;text-align:center}
.vbtn svg{width:100%;height:38px}
.vbtn[aria-pressed="true"]{border-color:var(--ink);background:#FFF3C4;box-shadow:inset 0 0 0 2px var(--ink)}
.fact{font-size:13.5px;background:#F2F4F7;border-radius:10px;padding:4px 10px;line-height:1.3}
.fact b{font-weight:800}
.style2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.style2 .lbl{margin:0 4px 0 0}
.worlds{display:flex;flex-direction:column;gap:8px}
.wbtn{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;cursor:pointer;background:#fff}
.wbtn .we{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:26px;border:2.5px solid var(--ink)}
.wbtn b{display:block;font-weight:800;font-size:15.5px;line-height:1.1}
.wbtn small{display:block;font-size:13px;color:var(--muted);line-height:1.2}
.wbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.wbtn[aria-pressed="true"] small{color:#d8dbe2}
.opts{display:flex;flex-direction:column;gap:12px}
.checkrow{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer;font-size:15px}
.checkrow input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.voicerow{display:flex;gap:8px;align-items:center}
.voicerow select{flex:1;min-width:0}
#voiceTest,#voiceTest2{padding:5px 12px;box-shadow:2px 2px 0 var(--ink);flex:none}
#voiceTip{margin-top:6px}
.rivalnote{font-size:14px;color:var(--muted);margin:0}

/* ---------- race ---------- */
#race{display:flex;flex-direction:column;gap:12px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:3px 12px 3px 4px;font-weight:800;font-size:15px;flex-wrap:wrap}
.chip .sw{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--ink)}
.chip.now{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}
.chip .dim{color:var(--muted);font-weight:700}
.worldtag{margin-left:auto;font-weight:800;font-size:15px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 10px}
.mapframe{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);background:#ccc}
.mapwrap{overflow:hidden}
.mapframe.scroll .mapwrap{overflow:auto;max-height:min(70vh,720px);overscroll-behavior:contain}
.mapinner{position:relative;width:calc(100% * var(--zoom,1));--cell:80px}
.mapinner svg.map{display:block;width:100%;height:auto}
.zoombox{position:absolute;right:10px;bottom:10px;z-index:30;display:flex;flex-direction:column;gap:6px}
.zoombox button{width:44px;height:44px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:24px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.layer{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;width:calc(var(--cell)*1.02);height:calc(var(--cell)*.64);transform:translate(-50%,-66%);transition:left .3s ease,top .3s ease;z-index:6}
.tok .flip{width:100%;height:100%;position:relative;transition:transform .2s}
.tok.left .flip{transform:scaleX(-1)}
.tok .bodywrap{width:100%;height:100%;transform-origin:50% 80%}
.tok svg{width:100%;height:100%;display:block;overflow:visible}
.tok .shadow{position:absolute;left:50%;top:86%;width:78%;height:26%;transform:translateX(-50%);border-radius:50%;background:var(--pc);opacity:.55;border:2px solid var(--ink)}
.tok.now .shadow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{opacity:.95;transform:translateX(-50%) scale(1.15)}}
.tok.driving .wh{animation:spin .3s linear infinite}
.tok.driving .bodywrap{animation:rumble .16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rumble{50%{transform:translateY(-1.5px)}}
.coin{display:inline-block;font-weight:800}
.coinpop{position:absolute;z-index:9;font-family:var(--display);font-size:calc(var(--cell)*.32);color:#B7791F;text-shadow:0 2px 0 #fff,0 0 6px #fff;transform:translate(-50%,-50%);animation:rise 1.6s ease-out forwards;pointer-events:none;white-space:nowrap}
.shopcard{width:min(860px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px;animation:popwin .35s cubic-bezier(.2,1.4,.4,1)}
.shophead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shophead h2{margin:0;margin-right:auto}
.wallet{font-family:var(--display);font-size:24px;background:#FFE58A;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;box-shadow:3px 3px 0 var(--ink)}
.shopwho{display:flex;gap:6px;flex-wrap:wrap}
.shopcat h3{margin:4px 0 6px;font-size:16px}
.shopcat p{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}
.prizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.prize{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;box-shadow:3px 3px 0 var(--ink)}
.prize .pe{font-size:34px;line-height:1.1}
.prize b{font-size:13px}
.prize small{font-weight:800;font-size:12px}
.prize.locked{opacity:.5;cursor:not-allowed}
.prize.owned small{color:var(--muted)}
.prize.on{background:#DFF6E6;border-color:#1E9E55}
.prize.on small{color:#1E9E55}
.prize:not(.locked):hover{transform:translateY(-2px)}
.shopnote{font-size:13px;color:var(--muted);font-weight:700}
.shopmsg{min-height:1.4em;font-weight:800}
.riders{position:absolute;left:10%;bottom:80%;display:flex;font-size:calc(var(--cell)*.2);line-height:1;pointer-events:none}
.riders span{display:inline-block;animation:wobble 1.4s ease-in-out infinite}
.riders span:nth-child(2n){animation-delay:.3s}
@keyframes wobble{50%{transform:rotate(9deg) translateY(-2px)}}
.tok.fx-spin .bodywrap{animation:fxspin 1s ease-in-out}
@keyframes fxspin{to{transform:rotate(360deg)}}
.tok.fx-flip .bodywrap{animation:fxflip 1.4s ease-in-out}
@keyframes fxflip{30%,70%{transform:rotate(180deg) translateY(-10px)}}
.tok.fx-hop .bodywrap{animation:fxhop .8s ease-in-out 2}
@keyframes fxhop{40%{transform:translateY(-35%) rotate(-6deg)}}
.tok.fx-honk .bodywrap{animation:fxhonk .12s linear 8}
@keyframes fxhonk{50%{transform:scale(1.12,.88)}}
.tok.fx-mud svg{filter:sepia(.8) brightness(.75)}
.tok.fx-shine svg{filter:brightness(1.2) saturate(1.4)}
.tok.fx-trap svg{filter:grayscale(1)}
.tok.fx-trap .bodywrap{animation:fxhonk .2s linear 6}
.tok.fx-warp{animation:warp .5s ease-in forwards}
@keyframes warp{to{transform:translate(-50%,-66%) scale(0) rotate(540deg)}}
.tok.fx-unwarp{animation:unwarp .5s ease-out}
@keyframes unwarp{from{transform:translate(-50%,-66%) scale(0) rotate(-540deg)}}
.tok.fx-lift{animation:lift .6s ease-in forwards}
@keyframes lift{to{transform:translate(-50%,-260%) rotate(-10deg)}}
.tok.fx-drop{animation:dropin .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes dropin{from{transform:translate(-50%,-260%)}}
.gift,.boost,.spc{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:3}
.gift{width:calc(var(--cell)*.4);height:calc(var(--cell)*.4);border:2.5px solid var(--ink);border-radius:22%;background:#B5179E;color:#fff;font-family:var(--display);font-size:calc(var(--cell)*.24);animation:bob 1.6s ease-in-out infinite}
.gift.new{animation:drop .6s cubic-bezier(.2,1.6,.4,1),bob 1.6s ease-in-out .6s infinite}
@keyframes drop{from{transform:translate(-50%,-300%) scale(.4)}}
.gift.gone{animation:pop .5s forwards}
@keyframes bob{50%{transform:translate(-50%,-62%) rotate(-7deg)}}
@keyframes pop{to{transform:translate(-50%,-50%) scale(2);opacity:0}}
.boost{width:calc(var(--cell)*.46);height:calc(var(--cell)*.46);border-radius:50%;background:radial-gradient(#FFF6A8,#FFD23F 60%,#F59E0B);border:2.5px solid var(--ink);font-size:calc(var(--cell)*.26);animation:zap 1.2s ease-in-out infinite}
@keyframes zap{50%{box-shadow:0 0 0 calc(var(--cell)*.08) rgba(255,210,63,.5)}}
.spc{font-size:calc(var(--cell)*.46);line-height:1}
.spc.crane{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:translate(-50%,-50%) rotate(5deg)}}
.light{position:absolute;width:calc(var(--cell)*.18);height:calc(var(--cell)*.34);transform:translate(55%,-118%);background:#222;border:2px solid var(--ink);border-radius:5px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;z-index:4;padding:2px 0}
.light i{width:66%;aspect-ratio:1;border-radius:50%;background:#555}
.light.red i:first-child{background:#ff3b30;box-shadow:0 0 6px #ff3b30}
.light.green i:last-child{background:#34c759;box-shadow:0 0 6px #34c759}
.stopz{position:absolute;width:calc(var(--cell)*.58);height:calc(var(--cell)*.58);transform:translate(-50%,-50%);border-radius:50%;border:4px solid #ff3b30;background:rgba(255,59,48,.2);z-index:2;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:calc(var(--cell)*.14);text-shadow:0 1px 0 #000}
.belt{position:absolute;width:calc(var(--cell)*.52);height:calc(var(--cell)*.4);transform:translate(-50%,-50%) rotate(var(--rot));background:repeating-linear-gradient(90deg,#3d3f46 0 7px,#7b7f8a 7px 14px);border:2.5px solid var(--ink);border-radius:6px;z-index:2;animation:belt .5s linear infinite;display:grid;place-items:center;color:#FFD23F;font-family:var(--display);font-size:calc(var(--cell)*.24)}
@keyframes belt{to{background-position:14px 0}}
.tgt{position:absolute;pointer-events:auto;width:calc(var(--cell)*.66);height:calc(var(--cell)*.66);min-width:30px;min-height:30px;transform:translate(-50%,-50%);border-radius:50%;border:4px dashed #fff;background:rgba(27,27,31,.25);cursor:pointer;z-index:7;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:calc(var(--cell)*.3);text-shadow:0 2px 0 #000;animation:tgt 1s ease-in-out infinite;padding:0}
.tgt.best{border-color:var(--gold);background:rgba(255,210,63,.6);border-style:solid}
@keyframes tgt{50%{transform:translate(-50%,-50%) scale(1.12)}}
.critter{position:absolute;font-size:calc(var(--cell)*.34);z-index:4;transform:translate(-50%,-50%);animation:cross 10s linear forwards}
.critter.rtl{animation-name:crossb}
@keyframes cross{from{left:-6%}to{left:106%}}
@keyframes crossb{from{left:106%}to{left:-6%}}
.particle{position:absolute;font-size:calc(var(--cell)*.3);z-index:8;animation:rise 2.2s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes rise{to{transform:translate(-50%,-260%) scale(1.4);opacity:0}}
.say{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:1px 9px;font-size:14px;font-weight:800;white-space:nowrap;z-index:9;animation:sayin .2s ease-out}
@keyframes sayin{from{transform:translate(-50%,-100%) scale(.5);opacity:0}}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:20;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:8px 16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;width:max-content;max-width:calc(100% - 20px);animation:toastin .35s cubic-bezier(.2,1.6,.4,1)}
.toast.trap{background:#2B1E3F;color:#fff}
.toast .te{font-size:34px;line-height:1;flex:none}
@keyframes toastin{from{transform:translateX(-50%) scale(.3)}}

.qpanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;border-top-width:10px}
@media (max-width:760px){.qpanel{grid-template-columns:minmax(0,1fr)}}
/* Wide screens: answer panel sits to the right of the map so everything fits on one screen. */
@media (min-width:1000px){
  .wrap:has(> #race:not([hidden])){max-width:1680px}
  #race{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,410px);align-items:start;gap:14px}
  #race .hud{grid-column:1 / -1}
  #race .mapframe{justify-self:center;width:100%}
  #race .qpanel{grid-template-columns:minmax(0,1fr);position:sticky;top:8px;gap:12px}
  #race .qshow{min-height:120px}
}
.qleft{display:flex;flex-direction:column;gap:10px;min-width:0}
.turn{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.turn .who{padding:1px 12px;border-radius:999px;color:#fff}
.honk{margin-left:auto;border:3px solid var(--ink);border-radius:999px;background:var(--gold);font-family:var(--display);font-size:15px;padding:2px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.honk:active{transform:translate(2px,2px);box-shadow:none}
.qshow{display:flex;align-items:center;justify-content:center;gap:14px;min-height:150px;background:#F2F4F7;border-radius:14px;padding:12px 52px 12px 12px;position:relative}
.qtext{font-family:var(--display);font-size:clamp(32px,6.2vw,56px);line-height:1.05;text-align:center;font-variant-numeric:tabular-nums}
.qtext .ans{display:inline-block;min-width:1.6em;border-bottom:5px solid var(--ink);color:var(--blue);padding:0 .1em}
.stack{display:grid;font-family:var(--display);font-size:clamp(32px,6vw,52px);line-height:1.08;font-variant-numeric:tabular-nums}
.stack i{font-style:normal;text-align:center}
.stack .op{padding-right:.2em}
.stack .rule{border-top:5px solid var(--ink);margin-top:4px}
.stack .ar{color:var(--blue);min-height:1.08em}
.speak{position:absolute;right:8px;top:8px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;width:42px;height:42px;cursor:pointer;display:grid;place-items:center}
.rollbig{font-family:var(--display);font-size:clamp(54px,10vw,84px);line-height:1;text-align:center}
.rollbig small{display:block;font-family:var(--body);font-size:18px;font-weight:800}
.fb{min-height:1.6em;font-weight:800;font-size:20px;text-align:center}
.fb.good{color:var(--good)} .fb.oops{color:var(--oops)}
.qright{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-size:28px;height:60px;cursor:pointer;touch-action:manipulation}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.key.gokey{background:var(--good);color:#fff}
.key.back{font-size:22px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:4px 4px 0 var(--ink);font-family:var(--display);font-size:clamp(30px,5vw,44px);height:110px;cursor:pointer;touch-action:manipulation}
.choice:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.choice.wrong{background:#FDE2DC;opacity:.55}
.choice.right{background:#C9F2D9}
.dpad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,64px);gap:6px;justify-content:center}
.dpad button{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);font-size:30px;font-weight:800;cursor:pointer;touch-action:manipulation}
.dpad button:disabled{opacity:.25;cursor:not-allowed;box-shadow:none}
.dpad button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hint{font-size:13px;line-height:1.05;background:var(--gold)!important}
.stlist{display:flex;flex-direction:column;gap:8px}
.stbtn{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:8px 12px;font-weight:800;font-size:18px;cursor:pointer;text-align:left;touch-action:manipulation}
.stbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.stbtn .ar{font-family:var(--display);font-size:22px;width:28px;text-align:center;flex:none}
.stbtn .dots{display:flex;gap:3px;flex:none}
.stbtn .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.stbtn.best{background:#FFF3C4}
.stbtn.hintbtn{justify-content:center;background:var(--gold);font-size:16px}
.drivehelp{text-align:center;font-weight:700;color:var(--muted);font-size:15px}
.qpanel.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.waiting{font-weight:800;color:var(--muted);text-align:center;font-size:20px}

.honk:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.hiker{position:absolute;transform:translate(-50%,-62%);z-index:4;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.hiker .an{font-size:calc(var(--cell)*.36);line-height:1;animation:wave 1.2s ease-in-out infinite}
.hiker .bub{background:#fff;border:2px solid var(--ink);border-radius:8px;font-size:max(10px,calc(var(--cell)*.13));font-weight:800;padding:0 5px;white-space:nowrap;line-height:1.3}
.hiker.new{animation:dropin2 .6s cubic-bezier(.2,1.6,.4,1)}
.hiker.gone{animation:hikeoff .5s forwards}
@keyframes wave{50%{transform:rotate(-12deg) translateY(-3px)}}
@keyframes dropin2{from{transform:translate(-50%,-300%) scale(.4)}}
@keyframes hikeoff{to{transform:translate(-50%,-160%) scale(1.6);opacity:0}}

/* ---------- teaching card (after two misses) ---------- */
.qpanel.teaching{grid-template-columns:minmax(0,1fr)}
.lesson{background:#FFFBEA;border:3px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px}
.lhead{font-weight:800;font-size:19px}
.lhead b{font-family:var(--display);font-weight:400}
.lrow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:center}
.lbox{background:#fff;border:2.5px solid #d5d7dd;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0;max-width:100%}
.lbox h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lbox.wide{flex:1 1 320px}
.lesson>.lbox.wide{flex:none}
.pop{animation:dotin .44s var(--dl,0s) both}
@keyframes dotin{from{transform:scale(0);opacity:0}}
.tfs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tf{display:grid;grid-template-columns:repeat(5,34px);grid-auto-rows:34px;border:3px solid var(--ink);background:#fff}
.tf .c{border:1.5px solid #9aa0aa;position:relative;display:grid;place-items:center;font-weight:800;font-size:15px}
.tf .c.a::after,.tf .c.b::after,.tf .c.x::after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid var(--ink);animation:dotin .44s var(--dl,0s) both}
.tf .c.a::after{background:#E63946}.tf .c.b::after{background:#2563EB}.tf .c.x::after{background:#E63946}
.tf .c.x::before{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:28px;color:#1b1b1f;z-index:1;animation:dotin .3s var(--dx,1s) both}
.tf .c.g{background:#FFF3C4;color:#1b1b1f}
.tf .c.g span{animation:dotin .44s var(--dl,0s) both}
.nl{width:100%}
.nl svg{display:block;width:100%;max-width:600px;height:auto;margin:0 auto}
.nl .hop{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .7s var(--dl,0s) forwards}
.nl .hl{opacity:0;animation:fadein .4s var(--dl,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.b10wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-size:26px}
.b10{display:flex;gap:4px;align-items:flex-end}
.rod{width:13px;height:104px;background:repeating-linear-gradient(transparent 0 8.4px,rgba(0,0,0,.35) 8.4px 10.4px),var(--col);border:2px solid var(--ink);border-radius:2px}
.rod.broken{background:repeating-linear-gradient(transparent 0 8.4px,rgba(0,0,0,.35) 8.4px 10.4px);border-style:dashed;opacity:.6}
.cubes{display:grid;grid-template-columns:repeat(5,13px);gap:2px;align-content:end}
.cube{width:13px;height:13px;background:var(--col);border:2px solid var(--ink)}
.trade{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800}
.trade .ten{display:grid;grid-template-columns:repeat(5,13px);gap:2px;border:3px dashed #E63946;border-radius:8px;padding:4px}
.arr{display:flex;flex-direction:column;gap:6px}
.arr .row{display:flex;gap:6px;align-items:center}
.arr .dot{width:20px;height:20px;border-radius:50%;background:#2563EB;border:2px solid var(--ink)}
.arr .sc{margin-left:8px;font-family:var(--display);font-size:20px;color:#E63946;min-width:2em}
.ms{display:grid;font-family:var(--display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.ms i{font-style:normal;text-align:center}
.ms .mk{color:#E63946;font-size:20px;align-self:end}
.ms .x{text-decoration:line-through;text-decoration-color:#E63946;text-decoration-thickness:4px}
.ms .rule{border-top:4px solid var(--ink)}
.ms .ar{color:var(--good)}
.steps{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:6px;font-size:19px;font-weight:700;line-height:1.3}
.steps li{opacity:0;animation:fadein .5s var(--dl,0s) forwards}
.steps b{color:var(--ink);background:#FFE58A;border-radius:4px;padding:0 3px}
.lcap{min-height:2.7em;font-weight:800;font-size:18px;text-align:center;line-height:1.3;max-width:640px;margin:0 auto}
.lcap.flash{animation:fadein .5s}
.lcap b{color:var(--ink);background:#FFE58A;border-radius:4px;padding:0 3px}
.teachbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.qtext.small{font-size:clamp(22px,4vw,36px);line-height:1.2}
.xing{position:absolute;transform:translate(-50%,-50%);width:calc(var(--cell)*.74);height:calc(var(--cell)*.74);z-index:4;pointer-events:none;display:grid;place-items:center}
.xing .ico{font-size:calc(var(--cell)*.4);opacity:0;transition:opacity .3s}
.xing.closed .ico{opacity:1}
.xing .bar{position:absolute;left:4%;top:44%;width:92%;height:14%;border:2px solid var(--ink);border-radius:4px;transform-origin:4% 50%;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.xing.gate .bar{background:repeating-linear-gradient(90deg,#E63946 0 9px,#fff 9px 18px);transform:rotate(-62deg) scaleX(.7)}
.xing.gate.closed .bar{transform:rotate(0)}
.xing.gate.closed .ico{animation:choo .9s ease-in-out infinite}
@keyframes choo{50%{transform:translateX(12%)}}
.xing.bridge{border-radius:10px}
.xing.bridge.closed{background:rgba(64,140,220,.55)}
.xing.bridge .bar{background:repeating-linear-gradient(90deg,#8B5E34 0 8px,#A9743F 8px 16px);height:30%;top:35%;transform:rotate(0)}
.xing.bridge.closed .bar{transform:rotate(-70deg)}
.cone{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--cell)*.42);z-index:4;transition:left .7s ease,top .7s ease;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.truck{position:absolute;transform:translate(-50%,-60%);font-size:calc(var(--cell)*.46);z-index:5;transition:left .8s ease,top .8s ease;pointer-events:none;animation:truckbob 1s ease-in-out infinite}
.truck span{position:absolute;left:8%;top:-38%;font-size:.6em}
@keyframes truckbob{50%{transform:translate(-50%,-66%)}}
.wreck{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--cell)*.55);z-index:9;pointer-events:none;animation:wreckin 1.1s ease-in forwards}
@keyframes wreckin{0%{transform:translate(-260%,-260%) rotate(-40deg)}55%{transform:translate(-50%,-50%) rotate(10deg)}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
.lesson.instant *{animation-delay:0s!important;transition-delay:0s!important}
.hintline{background:#F3EEFF;border:3px solid #7C3AED;border-radius:12px;padding:6px 12px;font-weight:800;font-size:18px;line-height:1.3;animation:sayin .25s ease-out}
.qtext .ans.blank{border:4px solid var(--ink);border-radius:10px;background:#fff;min-width:1.35em;min-height:1.1em;line-height:1.05;padding:0 .12em;vertical-align:-.12em;text-align:center}
.qtext sup{font-size:.55em;vertical-align:.75em;line-height:0}
.qtext .rt{display:inline-flex;align-items:flex-start}
.qtext .rt span{border-top:.09em solid currentColor;padding:0 .08em;margin-left:.02em}
.qtext .var{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;color:#7C3AED}
.qtext .solve{font-size:.8em;margin-top:.25em}
.qtext.word{font-family:var(--body);font-weight:700;font-size:clamp(19px,2.5vw,25px);line-height:1.38;text-align:left}
.qtext.word .wa{margin-top:.5em;font-size:1.15em}
.qtext.word .ans{font-family:var(--display)}
.alg{font-family:var(--display);font-size:clamp(20px,3.2vw,30px);line-height:1.55;text-align:center}
.alg .var{font-family:Georgia,serif;font-style:italic;font-weight:700;color:#7C3AED}
.alg sup{font-size:.55em;vertical-align:.75em;line-height:0}
.coins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-bottom:6px}
.coin{display:inline-grid;place-items:center;border-radius:50%;border:3px solid var(--ink);font-family:var(--body);font-weight:800;font-size:14px}
.coin.dime{width:42px;height:42px;background:radial-gradient(#F4F6F8,#B9C0C9)}
.coin.penny{width:50px;height:50px;background:radial-gradient(#F2B48A,#B8642F);color:#fff}
.grps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:540px}
.grp{border:3px dashed var(--ink);border-radius:50%;min-width:76px;min-height:76px;max-width:112px;padding:14px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center}
.grp .dot{width:16px;height:16px;border-radius:50%;background:#2563EB;border:2px solid var(--ink)}
.mrod{width:8px;height:40px;background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.35) 3px 4px),#E63946;border:1.5px solid var(--ink)}
.tf .c.k::after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid var(--ink);background:#1E9E55;animation:dotin .44s var(--dl,0s) both}
.lmodal{position:fixed;inset:0;z-index:70;background:rgba(27,27,31,.6);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lcard{width:min(980px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px;animation:popwin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes popwin{from{transform:scale(.85);opacity:0}}
.lq{display:flex;justify-content:center;background:#F2F4F7;border-radius:12px;padding:6px 10px}
.lq .qtext,.lq .stack{font-size:clamp(24px,4vw,40px)}
.lq .ans{color:var(--good)}
.teachbtns .skipbtn{background:#FFF3C4}
.teachbtns .chunk:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:2px 2px 0 var(--ink)}
.lcard .teachbtns{position:sticky;bottom:-14px;background:#fff;padding:8px 0 2px}
/* ---------- tens/ones T-chart ---------- */
.tchart{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.tcap{min-height:2.7em;font-weight:800;font-size:16px;text-align:center;line-height:1.3;max-width:340px;display:block}
.tcap.flash{animation:fadein .5s}
.tcap b{color:var(--ink);background:#FFE58A;border-radius:4px;padding:0 3px}
.tgrid{display:grid;grid-template-columns:minmax(150px,auto) minmax(128px,auto)}
.th{font-family:var(--display);font-size:17px;text-align:center;padding:2px 12px 4px;border-bottom:5px solid var(--ink)}
.tgrid>.th:first-child,.tcol.tens,.tdig.tens{border-right:5px solid var(--ink)}
.tcol{min-height:146px;padding:10px;display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:wrap;transition:background .4s;border-radius:0 0 6px 6px}
.tcol.ones{display:grid;grid-template-columns:repeat(5,18px);gap:4px;align-content:end}
.tcol.glow{background:#FFF3C4}
.tdig{font-family:var(--display);font-size:32px;text-align:center;min-height:1.3em;color:var(--good)}
.tdig.show{animation:dotin .6s both}
.tcol .rod{width:16px;height:120px;background:repeating-linear-gradient(transparent 0 10px,rgba(0,0,0,.35) 10px 12px),var(--col)}
.tcol .cube{width:18px;height:18px}
.tb{transition:transform .88s cubic-bezier(.3,1.4,.5,1),opacity .88s}
.tb.in{opacity:0;transform:translateY(-30px) scale(.4)}
.tb.pick{outline:3px solid #FFD23F;outline-offset:2px;box-shadow:0 0 0 6px rgba(255,210,63,.35)}
.tb.out{opacity:0!important;transform:translateY(-50px) scale(.3) rotate(25deg)!important;transition:transform 1.25s ease-in,opacity 1.25s ease-in!important}

/* ---------- victory parade ---------- */
#parade{position:fixed;inset:0;z-index:60;overflow:hidden;background:linear-gradient(#24306E,#6A4A9C 55%,#F7A25A)}
#parade canvas{position:absolute;inset:0;width:100%;height:100%}
.pbanner{position:absolute;top:7%;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;font-family:var(--display);font-size:clamp(26px,6.5vw,60px);line-height:1.05;color:var(--gold);text-shadow:4px 4px 0 var(--ink);animation:bannerin .9s cubic-bezier(.2,1.6,.4,1)}
.pbanner small{display:block;font-size:.42em;color:#fff}
@keyframes bannerin{from{transform:translateX(-50%) translateY(-200%) rotate(-8deg)}}
.pcity{position:absolute;left:0;right:0;bottom:26%;height:30%}
.pcity svg{width:100%;height:100%;display:block}
.proad{position:absolute;left:0;right:0;bottom:0;height:27%;background:#3A3D45;border-top:7px solid var(--gold)}
.proad::after{content:"";position:absolute;left:0;right:0;top:44%;height:6px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px)}
.ptrain{position:absolute;left:0;bottom:15%;display:flex;align-items:flex-end;gap:clamp(10px,3vw,30px);animation:parade 12s linear forwards;z-index:2}
@keyframes parade{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
.ptrain .pv{width:clamp(170px,34vw,320px);aspect-ratio:160/100;position:relative;flex:none}
.ptrain .pv svg{width:100%;height:100%;overflow:visible}
.ptrain .pv .wh{animation:spin .35s linear infinite}
.ptrain .pv .riders{font-size:clamp(26px,5vw,48px)}
.ptrain .emo{font-size:clamp(38px,8vw,72px);line-height:1;display:inline-block;animation:march .45s ease-in-out infinite alternate;flex:none}
.ptrain .emo:nth-child(2n){animation-delay:.2s}
@keyframes march{to{transform:translateY(-14px) rotate(6deg)}}
.float{display:flex;flex-direction:column;align-items:center;flex:none}
.float .deck{background:#E63946;border:3px solid var(--ink);border-radius:10px;padding:2px 10px;font-family:var(--display);color:#fff;font-size:clamp(12px,2.4vw,18px);white-space:nowrap}
.pcrowd{position:absolute;left:0;right:0;bottom:-2%;display:flex;justify-content:space-around;align-items:flex-end;font-size:clamp(30px,7vw,56px);z-index:3;pointer-events:none}
.pcrowd span{animation:cheer .5s ease-in-out infinite alternate}
.pcrowd span:nth-child(3n){animation-delay:.15s}.pcrowd span:nth-child(3n+1){animation-delay:.3s}
@keyframes cheer{to{transform:translateY(-16px)}}
.pskip{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:5}
.endcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(540px,calc(100% - 32px));text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:endin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes endin{from{transform:translate(-50%,-50%) scale(.3)}}
.endcard .big{font-family:var(--display);font-size:clamp(26px,6vw,40px);line-height:1.05}
.endcard .stats{display:flex;flex-direction:column;gap:2px;font-weight:700}
.endcard .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* ---------- new worlds ---------- */
.belt.syrup{background:repeating-linear-gradient(90deg,#8A4511 0 7px,#D98A2B 7px 14px);color:#FFF3C4}
.spc.whale{transition:left 1.2s ease-in-out,top 1.2s ease-in-out;font-size:calc(var(--cell)*.56);z-index:5}
.spc.whale::after{content:"💤";position:absolute;right:-10%;top:-30%;font-size:.45em;animation:wobble 1.6s ease-in-out infinite}
.spc.octo{animation:sway 2s ease-in-out infinite;transform-origin:50% 100%}
.spc.egg{animation:bob 1.4s ease-in-out infinite}
.spc.trike svg{width:calc(var(--cell)*.62);height:auto;display:block}
.spc.flap{width:calc(var(--cell)*.5);height:calc(var(--cell)*.6);background:#8B5A2B;border:3px solid var(--ink);border-radius:50% 50% 6px 6px/40% 40% 6px 6px;font-size:calc(var(--cell)*.24)}
.spc.flap::before{content:"";position:absolute;left:22%;right:22%;bottom:8%;height:36%;background:#5C3A1A;border:2px solid var(--ink);border-radius:6px}
.spc.flap span{position:relative}
.spc.boss{font-size:calc(var(--cell)*.42);animation:bob 1.2s ease-in-out infinite;z-index:5}
#mapsvg.flipping svg{animation:mflip .9s ease-in-out}
@keyframes mflip{50%{transform:scaleY(.15) rotate(2deg);filter:brightness(1.3)}}
.tok.space .bodywrap::before{content:"";position:absolute;inset:-14% -4% 6%;border-radius:50% 50% 30% 30%;border:2px solid rgba(255,255,255,.85);background:rgba(160,220,255,.22);z-index:1;pointer-events:none}
.tok.space .bodywrap::after{content:"🔥";position:absolute;left:-26%;top:38%;font-size:calc(var(--cell)*.26);transform:rotate(-90deg)}
.factbox{background:#1B2150;color:#fff;border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px;text-align:center}
/* ---------- try one + playable T-chart ---------- */
.tryban{background:#E8F7EE;border:3px solid var(--good);border-radius:14px;padding:8px 12px;font-weight:800;font-size:18px;text-align:center}
.tplay{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:70px}
.tplay .chunk{font-size:20px;padding:12px 22px}
.tplay .chunk.go{font-size:22px}
.tplay .chunk.soft{opacity:.7}
.tcount{font-family:var(--display);font-size:22px}
.tans{width:min(520px,100%);margin:0 auto}
.tans .choice{height:90px}
.tans .key{height:54px}
.tchart.play .tgrid{grid-template-columns:minmax(200px,auto) minmax(220px,auto)}
.tchart.play .tcol{min-height:190px}
.tchart.play .tcol.ones{grid-template-columns:repeat(5,32px);gap:7px}
.tchart.play .tcol .cube{width:32px;height:32px;border-radius:4px}
.tchart.play .tcol .rod{width:26px;height:160px;background:repeating-linear-gradient(transparent 0 14px,rgba(0,0,0,.35) 14px 16px),var(--col)}
.tchart.play .tcap{max-width:520px;font-size:18px}

.tchart.play.tapcubes .tcol.ones .cube:not(.out),.tchart.play.taprods .tcol.tens .rod:not(.out){cursor:pointer;animation:tapme 1.1s ease-in-out infinite}
@keyframes tapme{50%{box-shadow:0 0 0 5px rgba(255,210,63,.9)}}
.tchart.play .tb.pick{animation:none;outline:4px solid #FFB703;outline-offset:2px}
/* ---------- grown-ups page ---------- */
.gcard{width:min(1040px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px;animation:popwin .35s cubic-bezier(.2,1.4,.4,1)}
.ghead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ghead h2{margin:0}
.gnames{display:flex;gap:8px;flex-wrap:wrap}
.gsum{font-weight:700;color:var(--muted)}
.gtablewrap{overflow-x:auto;border:2.5px solid var(--ink);border-radius:12px}
.gt{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums;min-width:820px}
.gt th{background:#F2F4F7;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--ink)}
.gt td{padding:8px 10px;border-bottom:1px solid #E3E5EA;vertical-align:middle}
.gt tr:last-child td{border-bottom:0}
.gt td.sk{font-weight:800}
.gpill{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.gpill.up{background:#C9F2D9;color:#14532D}.gpill.mid{background:#FFF3C4;color:#713F12}.gpill.low{background:#FDE2DC;color:#7C2D12}.gpill.new{background:#E8EAF0;color:#3F4350}
.spark{display:block}
.gempty{background:#F2F4F7;border-radius:12px;padding:14px;font-weight:700}
.gconfirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FDE2DC;border-radius:12px;padding:8px 12px;font-weight:800}
.namenote{font-size:14px;color:var(--muted);margin:8px 0 0;font-weight:700}
/* subtraction blocks */
.subviz{margin-top:8px;background:#F2F4F7;border-radius:14px;padding:8px 10px 10px}
.subviz.off{background:none;padding:0;text-align:right}
.svtop{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.svtitle{font-weight:800;font-size:13.5px;color:#7C3AED}
.svbtns{display:flex;gap:4px}
.svb{border:2.5px solid var(--ink);background:#fff;border-radius:999px;font:800 12.5px var(--body,inherit);padding:2px 9px;cursor:pointer;line-height:1.3}
.svb.on{background:var(--ink);color:#fff}
.svb.show{font-size:13px;padding:4px 12px}
.svtower{display:flex;flex-direction:column;gap:4px;margin:8px 0 6px}
.svrow{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:6px}
.svlab{font-weight:800;font-size:12px;color:var(--muted);text-align:right}
.svbk{display:grid;grid-template-columns:repeat(10,minmax(0,26px));gap:3px}
.svbk i{display:block;aspect-ratio:1;border-radius:5px}
.svbk .bk{border:2.5px solid var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35)}
.svrow.ones .bk{background:#4F8EF7}.svrow.ten .bk{background:#F59E0B}
.svrow.ten .svbk{padding:2px;margin:-2px;border-radius:8px;outline:3px dashed rgba(27,27,31,.25);outline-offset:1px}
.svbk .bk.take{animation:svtake .55s ease-in forwards;animation-delay:var(--d)}
@keyframes svtake{35%{transform:translateY(-35%) scale(1.12);background:#FF6B6B}100%{transform:translateY(-10%) scale(.82);background:transparent;border-style:dashed;border-color:#B6BAC4;box-shadow:none}}
.svbk .bk.keep{animation:svglow .5s ease-in-out 2;animation-delay:var(--g)}
@keyframes svglow{50%{transform:scale(1.15);box-shadow:0 0 0 3px #FFD23F}}
.svsteps{display:flex;flex-direction:column;gap:2px}
.svst{font-weight:800;font-size:14.5px;line-height:1.25;opacity:0;animation:svin .35s ease-out forwards;animation-delay:var(--d)}
.svst .q{display:inline-block;min-width:1.2em;text-align:center;color:var(--blue,#2563EB);border-bottom:3px solid var(--ink)}
@keyframes svin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.svbk .bk.take{animation-duration:.01s}.svst{animation-duration:.01s}.svbk .bk.keep{animation:none}}
/* new world tiles */
.spc.twirl{animation:twirlspc 2.4s linear infinite}
@keyframes twirlspc{to{transform:translate(-50%,-50%) rotate(360deg)}}
.spc.bobb{animation:bobspc 1.4s ease-in-out infinite}
@keyframes bobspc{50%{transform:translate(-50%,-62%)}}
.spc.sway{animation:sway 2.2s ease-in-out infinite;transform-origin:50% 100%}
.spc.snooze::after{content:"💤";position:absolute;right:-12%;top:-28%;font-size:.45em;animation:wobble 1.6s ease-in-out infinite}
/* Setup screen: every ride and every world fits without scrolling. */
.vstrip{flex-wrap:wrap;overflow:visible;scroll-snap-type:none}
.vbtn{flex:0 0 76px}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:1200px) and (min-height:900px){#setup{margin-top:2vh}}
@media (max-width:520px){.worlds{grid-template-columns:minmax(0,1fr)}}
.wbtn{grid-template-columns:38px minmax(0,1fr);gap:8px;padding:5px 8px;border-radius:12px}
.wbtn .we{width:38px;height:38px;font-size:22px;border-radius:9px}
.wbtn b{font-size:14.5px}
.wbtn small{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (min-width:1200px){
  .wrap:has(> #setup:not([hidden])){max-width:1720px;padding-block:10px 16px;min-height:100vh;justify-content:center}
  #setup .vbtn{flex-basis:92px}
  #setup .vbtn svg{height:50px}
  #setup{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(300px,340px);gap:16px}
  #setup .setcol{display:contents}
  #setup .opts{gap:10px}
  #setup{align-items:stretch}
  #setup .wbtn{padding:5px 8px}
  #setup .wbtn small{-webkit-line-clamp:1}
  #setup .opts .go{margin-top:auto}
  #setup .players{grid-template-columns:minmax(0,1fr)}
  #playerCards:has(.player[data-i="1"]) .vbtn{flex-basis:64px;font-size:10.5px}
  #playerCards:has(.player[data-i="1"]) .vbtn svg{height:30px}
  #playerCards:has(.player[data-i="1"]) .player{padding:8px 10px;gap:6px}
  #playerCards:has(.player[data-i="1"]) .fact, #setup .card:has(.player[data-i="1"]) .namenote{display:none}
  #setup .modes{margin-bottom:8px}
  #setup h2{margin-bottom:6px}
}
.headbtns{display:flex;gap:6px;flex-wrap:wrap}
.racehead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.racehead h2{margin:0 0 10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo"><span class="flag" aria-hidden="true"></span>Number Speedway</div>
    <div class="topbtns">
      <button class="chunk" id="muteBtn" type="button" aria-pressed="false">Sound on</button>
      <button class="chunk" id="garageBtn" type="button" hidden>Back to garage</button>
    </div>
  </header>

  <!-- SETUP -->
  <section id="setup" aria-label="Race setup">
    <div class="card">
      <div class="racehead"><h2>Who's racing?</h2><span class="headbtns"><button class="chunk" id="shopBtn" type="button">🏆 Prize Shop</button><button class="chunk" id="statsBtn" type="button">Grown-ups 📊</button></span></div>
      <div class="modes" role="group" aria-label="Race mode">
        <button class="seg" type="button" data-mode="bot">1 player vs. Snoozy</button>
        <button class="seg" type="button" data-mode="solo">1 player, just drive</button>
        <button class="seg" type="button" data-mode="duo">2 players</button>
      </div>
      <div class="players" id="playerCards"></div>
      <p class="namenote">✏️ Type your name (like Charlie or Max) so the Grown-ups page can keep track of your math!</p>
    </div>
    <div class="setcol">
      <div class="card">
        <h2>Pick a world</h2>
        <div class="worlds" id="worlds" role="group" aria-label="World"></div>
      </div>
      <div class="card opts">
        <div><label class="lbl" for="size">Race length</label>
          <select id="size"><option value="s">Short race</option><option value="m" selected>Medium race</option><option value="l">Long race</option></select></div>
        <label class="checkrow"><input type="checkbox" id="readAloud" checked> Read questions out loud</label>
        <div><label class="lbl" for="voice">Reading voice (★ = most natural)</label>
          <div class="voicerow"><select id="voice"><option>Default voice</option></select><button type="button" class="chunk" id="voiceTest">▶ Test</button></div>
          <p class="rivalnote" id="voiceTip" hidden></p></div>
        <div><label class="lbl" for="voice2">Pop-up &amp; cheer voice</label>
          <div class="voicerow"><select id="voice2"><option value="">Same as the reading voice</option></select><button type="button" class="chunk" id="voiceTest2">▶ Test</button></div></div>
        <label class="checkrow"><input type="checkbox" id="helper"> Always show the best way (gold circle)</label>
        <p class="rivalnote" id="rivalNote"></p>
        <button class="chunk go" id="startBtn" type="button">Start your engines!</button>
      </div>
    </div>
  </section>

  <!-- RACE -->
  <section id="race" hidden aria-label="Race">
    <div class="hud" id="hud"></div>
    <div class="mapframe" id="mapframe">
      <div class="mapwrap" id="mapwrap">
        <div class="mapinner" id="mapinner">
          <div id="mapsvg"></div>
          <div class="layer" id="layer"></div>
        </div>
      </div>
      <div class="zoombox" id="zoombox" hidden>
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
      </div>
    </div>
    <div class="card qpanel" id="qpanel">
      <div class="qleft">
        <div class="turn" id="turn"></div>
        <div id="leftBody"></div>
        <div class="fb" id="fb" role="status" aria-live="polite"></div>
      </div>
      <div class="qright" id="answerArea"></div>
    </div>
  </section>
</div>

<section id="parade" hidden aria-label="Victory parade"></section>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const range=n=>Array.from({length:n},(_,i)=>i);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
/* =================== COINS + PRIZE SHOP =================== */
const PRIZES=[
 {cat:"top",e:"🎉",n:"Party Hat",c:20},{cat:"top",e:"🧢",n:"Ball Cap",c:25},{cat:"top",e:"🪖",n:"Hard Hat",c:30},{cat:"top",e:"🤠",n:"Cowboy Hat",c:35},{cat:"top",e:"🎩",n:"Top Hat",c:45},{cat:"top",e:"👑",n:"Crown",c:80},
 {cat:"trail",e:"💨",n:"Turbo Smoke",c:25},{cat:"trail",e:"✨",n:"Sparkles",c:30},{cat:"trail",e:"🫧",n:"Bubbles",c:35},{cat:"trail",e:"⭐",n:"Stars",c:45},{cat:"trail",e:"🌈",n:"Rainbow",c:60},{cat:"trail",e:"🔥",n:"Flames",c:75},
 {cat:"pal",e:"🐧",n:"Penguin",c:30},{cat:"pal",e:"🐼",n:"Panda",c:40},{cat:"pal",e:"🐙",n:"Octopus",c:40},{cat:"pal",e:"🦒",n:"Giraffe",c:50},{cat:"pal",e:"🤖",n:"Robot",c:55},{cat:"pal",e:"🦖",n:"T. rex",c:70},{cat:"pal",e:"🦄",n:"Unicorn",c:80},{cat:"pal",e:"🐉",n:"Dragon",c:100},
 {cat:"horn",e:"🦆",n:"Duck Quack",c:25,id:"quack"},{cat:"horn",e:"🤖",n:"Robot Beeps",c:30,id:"robot"},{cat:"horn",e:"🚂",n:"Choo-Choo",c:40,id:"choo"},{cat:"horn",e:"🚨",n:"Siren",c:45,id:"siren"},{cat:"horn",e:"🎺",n:"Fanfare",c:60,id:"fanfare"},
 {cat:"float",e:"🍦",n:"Ice Cream Float",c:40},{cat:"float",e:"🐘",n:"Elephant Float",c:55},{cat:"float",e:"🎠",n:"Carousel Float",c:70},{cat:"float",e:"🚀",n:"Rocket Float",c:90},{cat:"float",e:"🏰",n:"Castle Float",c:120}];
PRIZES.forEach(x=>x.id=x.cat+":"+(x.id||x.n));
const CATS={top:["🎩 Hats","Your car wears it on every race.",1],trail:["✨ Trails","Pops out behind your car as you drive.",1],pal:["🦄 Ride-along buddies","They ride on your car and wave in your parade. Pick up to 2.",2],horn:["📯 Horns","Plays when you press HONK.",1],float:["🎈 Parade floats","Join your victory parade. Pick up to 3.",3]};
const WAL_KEY="ns.wallet";
const wkey=name=>(name||"").trim().toLowerCase()||"racer";
function wallet(name){const all=load(WAL_KEY)||{},k=wkey(name);const w=all[k]||{coins:0,own:[],eq:[]};w.name=(name||"").trim()||"Racer";return w}
function saveWallet(w){const all=load(WAL_KEY)||{};all[wkey(w.name)]=w;store(WAL_KEY,all)}
const gearOf=name=>{const w=wallet(name);const by=c=>w.eq.map(id=>PRIZES.find(x=>x.id===id)).filter(x=>x&&x.cat===c);return {top:by("top")[0],trail:by("trail")[0],pals:by("pal"),horn:by("horn")[0],floats:by("float")}};
function hornPrize(id){const a=ac();if(!a||muted)return;const T=a.currentTime;
  const beep=(f,t,d,type="square",v=.1,f2)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,T+t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+t+d);g.gain.setValueAtTime(0,T+t);g.gain.linearRampToValueAtTime(v,T+t+.02);g.gain.linearRampToValueAtTime(0,T+t+d);o.connect(g).connect(a.destination);o.start(T+t);o.stop(T+t+d+.05)};
  if(id==="horn:quack"){beep(620,0,.16,"sawtooth",.09,380);beep(620,.22,.18,"sawtooth",.09,360)}
  else if(id==="horn:robot"){[880,660,990,520].forEach((f,i)=>beep(f,i*.09,.08,"square",.07))}
  else if(id==="horn:choo"){beep(370,0,.35,"sawtooth",.08);beep(466,0,.35,"sawtooth",.06);beep(370,.45,.55,"sawtooth",.08);beep(466,.45,.55,"sawtooth",.06)}
  else if(id==="horn:siren"){beep(700,0,.4,"triangle",.1,1100);beep(1100,.4,.4,"triangle",.1,700);beep(700,.8,.4,"triangle",.1,1100)}
  else if(id==="horn:fanfare"){[523,659,784,1047].forEach((f,i)=>beep(f,i*.12,i===3?.4:.11,"square",.07))}}

/* =================== VEHICLES (side view, facing right) =================== */
const K="#1b1b1f", O=`stroke='${K}' stroke-width='3' stroke-linejoin='round'`;
const svg=b=>`<svg viewBox='0 0 160 100' xmlns='http://www.w3.org/2000/svg' aria-hidden='true'>${b}</svg>`;
function wheel(x,y,r){return `<g class='wh' style='transform-origin:${x}px ${y}px'><circle cx='${x}' cy='${y}' r='${r}' fill='#2a2a30' ${O}/><circle cx='${x}' cy='${y}' r='${(r*.45).toFixed(1)}' fill='#c9ced6' stroke='${K}' stroke-width='2'/><rect x='${x-1.5}' y='${(y-r*.45).toFixed(1)}' width='3' height='${(r*.9).toFixed(1)}' fill='${K}'/></g>`}
function tracks(x,y,w,h){let s=`<rect x='${x}' y='${y}' width='${w}' height='${h}' rx='${h/2}' fill='#2a2a30' ${O}/>`;const n=Math.max(3,Math.round(w/20));for(let i=0;i<n;i++){const cx=+(x+h/2+i*(w-h)/(n-1)).toFixed(1),cy=y+h/2,r=h*.3;s+=`<g class='wh' style='transform-origin:${cx}px ${cy}px'><circle cx='${cx}' cy='${cy}' r='${r}' fill='#8a8f99'/><rect x='${cx-1}' y='${cy-r}' width='2' height='${r*2}' fill='${K}'/></g>`}return s}
function eyes(x,y,s=1){const e=(cx)=>`<ellipse cx='${cx}' cy='${y}' rx='${4*s}' ry='${5*s}' fill='#fff' stroke='${K}' stroke-width='1.5'/><circle cx='${cx+1.6*s}' cy='${y+.8*s}' r='${2.2*s}' fill='${K}'/>`;return e(x-5*s)+e(x+5*s)}
const win=(x,y,w,h)=>`<rect x='${x}' y='${y}' width='${w}' height='${h}' rx='3' fill='#bfe6ff' ${O}/>`;
const arm=(pts,c)=>`<polyline points='${pts}' fill='none' stroke='${K}' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/><polyline points='${pts}' fill='none' stroke='${c}' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/>`;
const Y="#F7B500";
/* Newsie, a Bichon Frise: round puffball head with a curly edge, floppy fluffy ears, button eyes and a little muzzle. */
function newsieHead(){
  const sc=SCAL, edge="#C9C1B3", fur="#FFFFFF", ear="#F2EADB";
  const puff=(pts,r,f,s)=>pts.map(([x,y])=>`<circle cx='${x}' cy='${y}' r='${r}' fill='${f}'${s?` stroke='${s}' stroke-width='1.6'`:""}/>`).join("");
  const earPts=side=>[[0,0],[0,6],[0,12],[side*3,17],[side*-2,18]].map(([dx,dy])=>[74+side*21+dx,33+dy]);
  return puff(earPts(-1),7.5,edge)+puff(earPts(1),7.5,edge)+puff(earPts(-1),6,ear)+puff(earPts(1),6,ear)+
    puff(sc,6.5,edge)+`<circle cx='74' cy='33' r='19.5' fill='${edge}'/>`+puff(sc,5,fur)+`<circle cx='74' cy='33' r='18' fill='${fur}'/>`+
    // curls in the fur
    [[63,20],[73,17],[84,20],[60,28],[88,28]].map(([x,y])=>`<path d='M${x-3} ${y} q3 -4 6 0' stroke='#DDD6C8' stroke-width='1.6' fill='none' stroke-linecap='round'/>`).join("")+
    // muzzle
    `<ellipse cx='74' cy='43' rx='9.5' ry='7' fill='#FFFFFF' stroke='#E3DCCF' stroke-width='1.4'/>`+
    // eyes with a soft shadow ring, like a real bichon
    [[66,34],[82,34]].map(([x,y])=>`<circle cx='${x}' cy='${y}' r='5' fill='#EFE8DC'/><circle cx='${x}' cy='${y}' r='3.6' fill='${K}'/><circle cx='${x+1.2}' cy='${y-1.3}' r='1.2' fill='#fff'/>`).join("")+
    `<ellipse cx='74' cy='40.5' rx='4' ry='3' fill='${K}'/><ellipse cx='72.8' cy='39.5' rx='1.2' ry='.7' fill='#fff' opacity='.8'/>`+
    `<path d='M74 43.5 v2.5 M69.5 46 Q74 50 78.5 46' stroke='${K}' stroke-width='1.8' fill='none' stroke-linecap='round'/><path d='M72 47.6 Q74 52.5 76 47.6 Z' fill='#F28AA0' stroke='#C9667B' stroke-width='1'/>`+
    // pink bow on top
    `<path d='M74 15 l-7 -4 v8 Z M74 15 l7 -4 v8 Z' fill='#FF6FB5' stroke='${K}' stroke-width='1.4' stroke-linejoin='round'/><circle cx='74' cy='15' r='2.2' fill='#FF6FB5' stroke='${K}' stroke-width='1.2'/>`+
    // collar
    `<path d='M62 51 Q74 56 86 51' stroke='#E63946' stroke-width='3.5' fill='none' stroke-linecap='round'/><circle cx='74' cy='55.5' r='2.4' fill='#FFD23F' stroke='${K}' stroke-width='1'/>`;
}
/* Cybertruck wheel: big black tire with a flat gray aero cover and an angular hub. */
function ctWheel(x,y){const r=14,hex=a=>range(6).map(i=>{const t=(i*60+a)*Math.PI/180;return `${(x+5*Math.cos(t)).toFixed(1)},${(y+5*Math.sin(t)).toFixed(1)}`}).join(" ");
  return `<g class='wh' style='transform-origin:${x}px ${y}px'><circle cx='${x}' cy='${y}' r='${r}' fill='#1F2023' ${O}/><circle cx='${x}' cy='${y}' r='10' fill='#9AA1A8' stroke='#2A2D31' stroke-width='1.5'/>`+
    range(6).map(i=>{const t=i*60*Math.PI/180;return `<line x1='${(x+5*Math.cos(t)).toFixed(1)}' y1='${(y+5*Math.sin(t)).toFixed(1)}' x2='${(x+10*Math.cos(t)).toFixed(1)}' y2='${(y+10*Math.sin(t)).toFixed(1)}' stroke='#6F767E' stroke-width='1.3'/>`}).join("")+
    `<polygon points='${hex(30)}' fill='#6F767E' stroke='#2A2D31' stroke-width='1.2'/><circle cx='${x}' cy='${y}' r='1.8' fill='#2A2D31'/></g>`}
const SCAL=[[92.0,33.0],[90.6,39.9],[86.7,45.7],[80.9,49.6],[74.0,51.0],[67.1,49.6],[61.3,45.7],[57.4,39.9],[56.0,33.0],[57.4,26.1],[61.3,20.3],[67.1,16.4],[74.0,15.0],[80.9,16.4],[86.7,20.3],[90.6,26.1]];
const VEHICLES=[
 {id:"newsie",name:"Newsiemobile",horn:"bark",fact:"Newsie the fluffy Bichon Frise drives this car! Press BARK to say hi. Woof woof!",svg:svg(newsieHead()+
   `<path d='M8 76 Q8 60 26 58 L134 58 Q154 60 154 76 Z' fill='#2EC4B6' ${O}/><path d='M106 58 L114 38 L119 38 L113 58 Z' fill='#bfe6ff' ${O}/>`+
   [[62,58],[86,58]].map(([x,y])=>`<ellipse cx='${x}' cy='${y}' rx='6.5' ry='4.5' fill='#fff' stroke='#B8B0A2' stroke-width='1.8'/><path d='M${x-2} ${y-1} v2.5 M${x+2} ${y-1} v2.5' stroke='#B8B0A2' stroke-width='1.2'/>`).join("")+

const WORD={"+":"plus","−":"minus","×":"times","÷":"divided by"};
function sub20Q(a,b){
  return {a,b,op:"−",kind:"sub20",text:`${a} − ${b}`,
    html:`${a} − ${b} = <span class="ans" data-a>?</span>`,say:`${a} minus ${b}.`,answer:a-b,
    plain:`${a} − ${b} = <span class="ans" data-a>?</span>`,sayPlain:`${a} minus ${b}.`};
}
/* =================== SUBTRACTION BLOCKS (subtraction within 20 only) ===================
   Two ways to take away from a teen number, shown with a tower of blocks: the ones sit on top, the ten sits underneath.
   Going high: take from the top. Get to 10 first, then take the rest from the 10.
   Going low: take the whole number away from the 10, then put the 10's leftovers with the ones.
   If the ones are enough, just take from the ones. The last step always ends in "?" so the child still finds the answer.
   Pure CSS animation on its own element, so the problem shows up and can be answered right away. */
let svOn=load("ns-subviz"); if(svOn==null)svOn=true;
const svWanted=()=>svOn&&G.q&&G.q.kind==="sub20"&&!!$("#subviz");
/* Go high: take away the ones on top to get down to 10, then take the rest from the 10. Whole animation is about 1 second. */
function subVizHTML(a,b){
  const ones=a-10, cross=b>ones&&ones>0, gap=.07, T1=.2;
  const top=new Map(), bot=new Map();
  let steps,T2,glowAt;
  if(!cross){
    for(let k=0;k<b;k++)top.set(ones-1-k,T1+k*gap);
    T2=T1+b*gap+.15; glowAt=T2+.2;

function choicesFor(ans){
  const pool=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+3].filter(v=>v>=0&&v!==ans);
  const out=new Set([ans]); while(out.size<3&&pool.length){out.add(pool.splice(Math.floor(Math.random()*pool.length),1)[0])}
  return shuffle([...out]);
}

function tone(f,dur,type="sine",vol=.15,t0=0,f2=null){
  const a=ac(); if(!a||muted)return; const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}

let BARK_CLIP=null;try{BARK_CLIP=new Audio("audio/bark.mp3");BARK_CLIP.preload="auto"}catch(e){}
function bark(){
  if(BARK_CLIP&&!muted&&BARK_CLIP.readyState>=2){try{BARK_CLIP.currentTime=0;BARK_CLIP.play().catch(()=>synthBark());return}catch(e){}}
  synthBark();
}
function synthBark(){
  const a=ac(); if(!a||muted)return;
  const out=a.createGain(); out.gain.value=.55; out.connect(a.destination);
  // gentle distortion gives the throaty edge a real bark has
  const sh=a.createWaveShaper(),c=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(3*x)}sh.curve=c;
  [[0,1],[.26,.9]].forEach(([t0,pm])=>{
    const t=a.currentTime+t0+Math.random()*.02, dur=.17+Math.random()*.04, f0=(380+Math.random()*70)*pm;
    // voice: pitch jumps up on the "w" and drops on the "oof"
    const o=a.createOscillator();o.type="sawtooth";
    o.frequency.setValueAtTime(f0*.7,t);o.frequency.linearRampToValueAtTime(f0*1.3,t+.035);o.frequency.exponentialRampToValueAtTime(f0*.62,t+dur);
    // a little rough flutter
    const am=a.createGain();am.gain.value=.75;const lfo=a.createOscillator();lfo.frequency.value=48+Math.random()*14;const lg=a.createGain();lg.gain.value=.28;lfo.connect(lg).connect(am.gain);
    // breath noise
    const nb=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const nz=a.createBufferSource();nz.buffer=nb;const nf=a.createBiquadFilter();nf.type="bandpass";nf.frequency.value=1700;nf.Q.value=.8;const ng=a.createGain();ng.gain.value=.55;
    // mouth shape: two vocal resonances that open then close
    const f1=a.createBiquadFilter();f1.type="bandpass";f1.Q.value=2.5;f1.frequency.setValueAtTime(650,t);f1.frequency.linearRampToValueAtTime(1150,t+.04);f1.frequency.linearRampToValueAtTime(550,t+dur);
    const f2=a.createBiquadFilter();f2.type="bandpass";f2.Q.value=3.5;f2.frequency.setValueAtTime(1800,t);f2.frequency.linearRampToValueAtTime(2300,t+.04);f2.frequency.linearRampToValueAtTime(1500,t+dur);
    // chest thump underneath
    const body=a.createOscillator();body.type="sine";body.frequency.setValueAtTime(f0*.5,t);body.frequency.exponentialRampToValueAtTime(f0*.35,t+dur);const bg=a.createGain();bg.gain.value=.5;
    const env=a.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(1,t+.007);env.gain.exponentialRampToValueAtTime(.4,t+.07);env.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(sh);sh.connect(am);am.connect(f1);am.connect(f2);nz.connect(nf).connect(ng);ng.connect(f1);ng.connect(env);f1.connect(env);f2.connect(env);body.connect(bg).connect(env);env.connect(out);
    [o,lfo,body].forEach(x=>{x.start(t);x.stop(t+dur+.05)});nz.start(t);
  });
}
function horn(v){
  if(v==="newsie"){bark();return}
  const a=ac(); if(!a||muted)return;
  const train=v==="metro", base=train?233:Math.max(200,Math.min(520,vehicle(v).horn||400));
  const notes=train?[base,base*1.26,base*1.5]:[base,base*1.26];
  (train?[[0,.9]]:[[0,.2],[.3,.45]]).forEach(([t0,dur])=>{
    const t=a.currentTime+t0, g=a.createGain(), lp=a.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value=train?1400:2000; lp.Q.value=3;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.14,t+.02); g.gain.setValueAtTime(.14,t+dur-.05); g.gain.linearRampToValueAtTime(0,t+dur);
    notes.forEach(fr=>{const o=a.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(fr,t);o.connect(lp);o.start(t);o.stop(t+dur+.03)});
    lp.connect(g).connect(a.destination);
  });
}
/* Voices: each browser and device has its own set, so rank them and use the most human-sounding one.
   Neural voices ("Natural", "Online", Google, Siri, Enhanced) sound far better than the old desktop ones. */
const VOICE_GOOD=[[/natural/i,100],[/neural/i,95],[/premium/i,80],[/enhanced/i,75],[/siri/i,70],[/google/i,60],[/online/i,40],[/(ava|samantha|allison|jenny|aria|emma|michelle|sonia|libby|natasha|guy|andrew|brian|ana)\b/i,25]];
const VOICE_BAD=/(david|zira|mark|hazel|george|fred|albert|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|organ|superstar|ralph|junior|kathy|bahh|jester|wobble|espeak|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy)/i;
function voiceScore(v){let s=0;for(const [re,w] of VOICE_GOOD)if(re.test(v.name))s+=w;if(VOICE_BAD.test(v.name))s-=80;if(/^en[-_]US/i.test(v.lang))s+=12;else if(/^en/i.test(v.lang))s+=6;if(!v.localService)s+=8;return s}
let VOICES=[];
const isNatural=v=>!!v&&voiceScore(v)>=55;
function loadVoices(){try{VOICES=(window.speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a))}catch(e){VOICES=[]}renderVoices()}
function pickVoice(){return VOICES.find(v=>v.voiceURI===SET.voice)||VOICES[0]||null}
function pickVoice2(){return (SET.voice2&&VOICES.find(v=>v.voiceURI===SET.voice2))||pickVoice()}
function renderVoices(){
  const sel=$("#voice"),tip=$("#voiceTip");if(!sel)return;const cur=pickVoice();
  sel.innerHTML=VOICES.length?VOICES.map(v=>`<option value="${esc(v.voiceURI)}"${v===cur?" selected":""}>${isNatural(v)?"★ ":""}${esc(v.name.replace(/^(Microsoft|Google) /,"").replace(/ - English.*$/,""))}</option>`).join(""):`<option>Default voice</option>`;
  const s2=$("#voice2");if(s2){const c2=SET.voice2&&VOICES.find(v=>v.voiceURI===SET.voice2);
    s2.innerHTML=`<option value="">Same as the reading voice</option>`+VOICES.map(v=>`<option value="${esc(v.voiceURI)}"${v===c2?" selected":""}>${isNatural(v)?"★ ":""}${esc(v.name.replace(/^(Microsoft|Google) /,"").replace(/ - English.*$/,""))}</option>`).join("")}

function speakNow(text,pop){try{const s=window.speechSynthesis;if(!s||muted)return;s.cancel();

  (String(text).match(/[^.!?]+[.!?]*/g)||[String(text)]).forEach(t=>{t=t.trim();if(!t)return;
    const u=new SpeechSynthesisUtterance(t);if(v){u.voice=v;u.lang=v.lang}u.rate=1;u.pitch=nat?1.05:1;s.speak(u)})}catch(e){}}

function reshapeMaze(k){

  for(let r=0;r<M.rows;r++)for(let c=0;c<M.cols;c++){const n=nid(c,r);if(c<M.cols-1)all.push(ek(n,n+1));if(r<M.rows-1)all.push(ek(n,n+M.cols))}

}
const isWhale=n=>!!(M.whales&&M.whales.includes(n));

function makeMetro(){

  p.boss={got:0}; renderHud(); sfx("villain"); fx(p,"trap",1500); particles(p,"😼",5);
  const t=`Mayor Humdinger popped up! "You'll never get my trophy!" Get 3 right in a row to beat him!`;
  toast("🎩",t,"trap"); speakPop(t);
  $("#leftBody").innerHTML=`<div class="waiting">🎩😼 Humdinger challenge! Get 3 in a row!</div>`; await sleep(3600);
}
async function beatBoss(p){
  p.boss="beat"; p.bonus+=3; earn(p,10); p.riders.push("🏅"); if(p.riders.length>4)p.riders.shift(); setRiders(p); renderHud();
  const t="ACHOO! Mayor Humdinger sneezed himself into a giant pile of glitter! You beat him! +3 bonus moves!";
  toast("🤧",t); speakPop(t); sfx("boing"); particles(p,"✨",14); fx(p,"shine",2600); await sleep(3200);
}
function askQuestion(){
  const p=cur(); const f=FOCUS.find(x=>x.id===p.focus)||FOCUS[1];
  const recent=G.recent[p.idx]||(G.recent[p.idx]=[]);
  let q; for(let t=0;t<12;t++){q=f.gen();if(!recent.includes(q.text))break}
  recent.push(q.text); if(recent.length>6)recent.shift();
  G.q=q; G.tries=0; G.input=""; G.phase="question"; p.asked++; G.qStart=Date.now();
  setTurnLabel(`answer to roll for ${unitWord(2)}!`);
  $("#leftBody").innerHTML=`<div class="qshow"><div id="qtext"></div><button class="speak" id="speakBtn" type="button" aria-label="Read the question out loud"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#FFD23F"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button></div>`;
  addSubViz();
  const qSay=()=>svWanted()&&G.q.sayPlain?G.q.sayPlain:G.q.say;
  $("#speakBtn").onclick=()=>speakNow(qSay());
  drawQuestion(); setFb(""); drawAnswerArea(); speak(qSay());
}
/* On wide screens, shrink the map so it fits the screen height next to the answer panel. */
function fitMap(){
  const f=$("#mapframe"); if(!f||!M)return;
  if(M.kind==="graph"||!matchMedia("(min-width:1000px)").matches){f.style.maxWidth="";return}
  f.style.maxWidth="";
  const r=f.getBoundingClientRect(), top=r.top+scrollY, room=innerHeight-Math.min(top,140)-22;
  if(r.height>room)f.style.maxWidth=Math.max(520,room*r.width/r.height)+"px";
}
addEventListener("resize",()=>{if(!$("#race").hidden){fitMap();try{sizeCell();drawTokens()}catch(e){}}});
function drawQuestion(){
  const q=G.q, box=$("#qtext"); if(!box)return;
  if(q.stack){
    const {a,b,op}=q.stack; const w=Math.max(a.length,b.length,String(q.answer).length);
    const cells=s=>range(w).map(k=>`<i>${s[s.length-w+k]??""}</i>`).join("");
    const ans=G.input; box.className="stack"; box.style.gridTemplateColumns=`auto repeat(${w},.78em)`;
    box.innerHTML=`<span class="op"></span>${cells(a)}<span class="op">${op}</span>${cells(b)}<div class="rule" style="grid-column:1 / span ${w+1}"></div><span class="op"></span>${range(w).map(k=>`<i class="ar">${ans[ans.length-w+k]??""}</i>`).join("")}`;
  }else{
    const pl=q.plain&&svWanted();
    box.className="qtext"+(q.small?" small":"")+(pl?" svplain":q.cls?" "+q.cls:""); box.style.gridTemplateColumns=""; box.innerHTML=pl?q.plain:q.html;
    const a=box.querySelector("[data-a]"); if(a)a.textContent=G.input||(a.classList.contains("blank")?"\u00a0":"?");
  }
}
function drawAnswerArea(){
  const p=cur(), area=$("#answerArea");
  if(p.style==="choices")area.innerHTML=`<div class="choices">${(G.q.choices||choicesFor(G.q.answer)).map(v=>`<button type="button" class="choice" data-v="${v}">${v}</button>`).join("")}</div>`;
  else area.innerHTML=`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button type="button" class="key" data-k="${d}">${d}</button>`).join("")}<button type="button" class="key back" data-k="back" aria-label="Erase">⌫</button><button type="button" class="key" data-k="0">0</button><button type="button" class="key gokey" data-k="go">GO</button></div>`;
}
$("#answerArea").addEventListener("click",e=>{
  if(G.phase==="question"){
    const c=e.target.closest(".choice"); if(c&&!c.classList.contains("wrong")){G.input=c.dataset.v;drawQuestion();check(+c.dataset.v,c);return}
    const k=e.target.closest(".key"); if(k)press(k.dataset.k);
  }else if(G.phase==="drive"){
    if(e.target.closest(".hint")){showHint();return}
    const d=e.target.closest("[data-n]"); if(d&&!d.disabled)step(+d.dataset.n);
  }
});
function press(k){
  if(G.phase!=="question"||cur().style!=="type")return;
  if(k==="back")G.input=G.input.slice(0,-1);
  else if(k==="go"){if(G.input!=="")check(+G.input);return}
  else if(G.input.length<4)G.input=(G.input==="0"?"":G.input)+k;
  sfx("pop"); drawQuestion();
}
document.addEventListener("keydown",e=>{
  if($("#race").hidden||G.over||e.target.closest("input,select,textarea"))return;
  if(G.phase==="question"){
    if(/^\d$/.test(e.key)){press(e.key);e.preventDefault()}
    else if(e.key==="Backspace"){press("back");e.preventDefault()}
    else if(e.key==="Enter"){press("go");e.preventDefault()}
  }else if(G.phase==="drive"){
    const v={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
    if(!v)return; e.preventDefault();
    // pick the neighbour that lies most in the arrow's direction
    const n=cur().node; let best=null,bs=.35;
    for(const m of M.adj[n]){const dx=M.x[m]-M.x[n],dy=M.y[m]-M.y[n],l=Math.hypot(dx,dy)||1,sc=(dx*v[0]+dy*v[1])/l;if(sc>bs){bs=sc;best=m}}
    if(best!=null)step(best); else{sfx("bonk");bubble(cur(),"Bonk! No track that way!")}
  }
});

/* =================== TEACHING (after two misses) ===================
   Each skill gets the picture a math teacher would draw: ten frames, number lines,
   a tens/ones T-chart with blocks that move, arrays, and the written steps, all built from the missed problem. */
const SLOW=1; // lessons play at normal speed
const dl=s=>`--dl:${(s*SLOW).toFixed(2)}s`;
function tenFrame(cells,t0=0){ // cells: "a" red dot, "b" blue dot, "x" crossed-out dot, "g"+n highlighted empty box, "" empty
  return `<div class="tf">${range(10).map(i=>{const c=cells[i]||"";const g=c[0]==="g";return `<span class="c ${g?"g":c}" style="${dl(t0+i*.12)};--dx:${((t0+1.4+i*.12)*SLOW).toFixed(2)}s">${g?`<span style="${dl(t0+.4+i*.25)}">${c.slice(1)}</span>`:""}</span>`}).join("")}</div>`}
function frameCells(spec){const out=[];spec.forEach(([kind,n])=>{for(let i=0;i<n;i++)out.push(kind)});return out}
function numberLine(min,max,hops,mark,t0=0,labels=[]){
  const L=26,Rr=574,X=v=>L+(v-min)*(Rr-L)/Math.max(1,max-min),span=max-min,step=span<=20?1:span<=50?5:span<=100?10:span<=500?50:100;
  let s=`<line x1="${L}" y1="96" x2="${Rr}" y2="96" stroke="#1b1b1f" stroke-width="3"/>`;
  labels.forEach(l=>{if(l.ring){s+=`<circle class="hl" style="${dl(t0+.2)}" cx="${X(l.v)}" cy="118" r="${String(l.v).length>2?23:18}" fill="none" stroke="${l.color||"#F97316"}" stroke-width="3.5"/>`;return}s+=`<line x1="${X(l.v)}" y1="80" x2="${X(l.v)}" y2="104" stroke="${l.color||"#7C3AED"}" stroke-width="3" stroke-dasharray="${l.dash?"4 3":"none"}"/><text x="${X(l.v)}" y="${l.y||74}" font-size="14" font-weight="800" text-anchor="middle" fill="${l.color||"#7C3AED"}" font-family="Arial">${l.text}</text>`});
  for(let v=min;v<=max;v+=step)s+=`<line x1="${X(v)}" y1="88" x2="${X(v)}" y2="104" stroke="#1b1b1f" stroke-width="2"/><text x="${X(v)}" y="124" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial">${v}</text>`;
  if(mark!=null)s+=`<circle class="hl" style="${dl(t0+hops.length*.5+.3)}" cx="${X(mark)}" cy="96" r="11" fill="#1E9E55" stroke="#1b1b1f" stroke-width="2"/>`;
  hops.forEach((h,i)=>{const x1=X(h.from),x2=X(h.to),mx=(x1+x2)/2,ht=Math.min(70,16+Math.abs(x2-x1)*.45),col=h.to>=h.from?"#2563EB":"#E63946";
    s+=`<path class="hop" style="${dl(t0+i*.5)}" d="M${x1} 92 Q${mx} ${92-ht*1.5} ${x2} 92" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round"/>`;
    if(h.label)s+=`<text class="hl" style="${dl(t0+i*.5+.35)}" x="${mx}" y="${92-ht*.75-6}" font-size="${Math.abs(x2-x1)<26?12:15}" font-weight="800" text-anchor="middle" fill="${col}" font-family="Arial">${h.label}</text>`});
  if(hops.length)s+=`<circle cx="${X(hops[0].from)}" cy="96" r="7" fill="#FFD23F" stroke="#1b1b1f" stroke-width="2"/>`;
  return `<div class="nl"><svg viewBox="0 0 600 144" role="img" aria-label="Number line">${s}</svg></div>`;
}
const ones=(from,n,dir=1)=>range(n).map(i=>({from:from+i*dir,to:from+(i+1)*dir,label:dir>0?"+1":"−1"}));
function dotArray(r,c,t0=0){return `<div class="arr">${range(r).map(i=>`<div class="row">${range(c).map(j=>`<span class="dot pop" style="${dl(t0+i*.45+j*.04)}"></span>`).join("")}<span class="sc pop" style="${dl(t0+i*.45+.3)}">${(i+1)*c}</span></div>`).join("")}</div>`}
const RED="#E63946",BLUE="#2563EB",PURPLE="#7C3AED",ORANGE="#D97706";
function miniStack(a,b,op,ans,mode,t0=3,col={}){
  const A=String(a),B=String(b),S=String(ans),w=Math.max(A.length,B.length,S.length),at=(s,k)=>s[s.length-w+k]??"";
  const top=range(w).map(k=>{
    if(mode==="carry"&&k===w-2)return `<i class="mk pop" style="${dl(t0-1.4)};color:${PURPLE}">1</i>`;
    if(mode==="borrow"&&k===w-2)return `<i class="mk pop" style="${dl(t0-1.4)};color:${col.a||""}">${+at(A,k)-1}</i>`;
    if(mode==="borrow"&&k===w-1)return `<i class="mk pop" style="${dl(t0-1.1)};color:${ORANGE}">${+at(A,k)+10}</i>`;
    return "<i></i>"}).join("");
  const rowA=range(w).map(k=>`<i class="${mode==="borrow"&&k>=w-2?"x":""}" style="color:${col.a||""}">${at(A,k)}</i>`).join("");
  return `<div class="ms" style="grid-template-columns:auto repeat(${w},.8em)"><i></i>${top}<i></i>${rowA}<i>${op}</i>${range(w).map(k=>`<i style="color:${col.b||""}">${at(B,k)}</i>`).join("")}<div class="rule" style="grid-column:1 / span ${w+1}"></div><i></i>${range(w).map(k=>`<i class="ar pop" style="${dl(t0+k*.2)}">${at(S,k)}</i>`).join("")}</div>`;
}
const box=(title,inner,wide)=>`<div class="lbox${wide?" wide":""}"><h4>${title}</h4>${inner}</div>`;
function blocks(n,col,t0=0){const t=Math.floor(n/10),o=n%10;let k=0;return `<div class="b10" style="--col:${col}">${range(t).map(()=>`<span class="rod pop" style="${dl(t0+(k++)*.12)}"></span>`).join("")}<span class="cubes">${range(o).map(()=>`<span class="cube pop" style="${dl(t0+(k++)*.08)}"></span>`).join("")}</span></div>`}
