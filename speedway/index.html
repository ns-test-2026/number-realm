function groupsHTML(g,s,delay=(i,j)=>i*.6+j*.15){return `<div class="grps">${range(g).map(i=>`<div class="grp pop" style="${dl(i*.3)}">${range(s).map(j=>`<span class="dot pop" style="${dl(delay(i,j)+.3)}"></span>`).join("")}</div>`).join("")}</div>`}
function rodArray(r,k,t){return `<div class="arr">${range(r).map(i=>`<div class="row">${range(k).map(j=>`<span class="mrod pop" style="${dl(i*.5+j*.05)}"></span>`).join("")}<span class="sc pop" style="${dl(i*.5+.3)}">${(i+1)*t}</span></div>`).join("")}</div>`}
function coinsHTML(d,p){return `<div class="coins">${range(d).map(i=>`<span class="coin dime pop" style="${dl(i*.4)}">10¢</span>`).join("")}${range(p).map(i=>`<span class="coin penny pop" style="${dl(d*.4+.4+i*.3)}">1¢</span>`).join("")}</div>`}

/* ----- the tens/ones T-chart: blocks drop in, bundle into tens, break apart, and get taken away ----- */
const tchart=()=>box("Tens and ones",`<div class="tchart"><div class="tcap" aria-live="polite">&nbsp;</div><div class="tgrid"><div class="th">Tens</div><div class="th">Ones</div><div class="tcol tens"></div><div class="tcol ones"></div><div class="tdig tens"></div><div class="tdig ones"></div></div></div>`);
const tenWord=n=>`${n} ten${n===1?"":"s"}`, oneWord=n=>`${n} one${n===1?"":"s"}`;
const tensOnes=(t,o)=>t&&o?`${tenWord(t)} and ${oneWord(o)}`:t?tenWord(t):oneWord(o);
function blockEl(kind,col){const e=document.createElement("span");e.className=(kind==="rod"?"rod":"cube")+" tb in";e.style.setProperty("--col",col);return e}
/* Speak one line and resolve when the voice finishes, so block moves can wait for the words.
   With reading turned off (or no voice), wait about as long as the sentence would take to say. */
const plainSpeech=s=>s.replace(/<[^>]+>/g,"").replace(/−/g," minus ").replace(/×/g," times ").replace(/÷/g," divided by ").replace(/\+/g," plus ").replace(/=/g," equals ").replace(/✓/g,"").replace(/¢/g," cents").replace(/→/g," then ");
/* ---------- recorded voice-over ----------
   voice.mp3 holds every lesson phrase and number, spoken by a natural Kokoro voice; voice.json says where
   each clip sits. A sentence is played by stitching its clips ("Let's solve" + "42" + "plus" + "28").
   Anything without clips falls back to the browser's own voice. */
const VO={ready:false,loading:null,buf:null,clips:null,live:new Set()};
const USE_RECORDED=false; // Edge's natural voices sound better to the family, so recorded clips are off
function loadVoiceover(){
  if(!USE_RECORDED)return Promise.resolve();
  if(VO.loading)return VO.loading;
  VO.loading=(async()=>{try{
    const j=await (await fetch("voice.json")).json();
    const a=ac();if(!a)return;
    VO.buf=await a.decodeAudioData(await (await fetch(j.file||"voice.mp3")).arrayBuffer());
    VO.clips=j.clips;VO.ready=true;
  }catch(e){VO.ready=false}})();
  return VO.loading;
}
function voiceKeys(text){
  if(!VO.ready)return null;const keys=[];
  for(const part of String(text).split(/(\d+)/)){
    if(/^\d+$/.test(part)){const n=+part;
      if(n<=100||n===1000)keys.push("n:"+n);else if(n<1000){keys.push("h:"+Math.floor(n/100));if(n%100)keys.push("n:"+(n%100))}else return null;continue}
    const k=part.toLowerCase().replace(/[^a-z']+/g," ").trim();
    if(k)keys.push("t:"+k);
    // a little breath at the end of a sentence or after a comma
    const tail=part.trim().slice(-1);if(/[.!?:]/.test(tail))keys.push("p:.28");else if(tail===",")keys.push("p:.12");
  }
  return keys.every(k=>k[0]==="p"||VO.clips[k])?keys:null;
}
function playClips(keys){
  return new Promise(res=>{
    const a=ac();let t=a.currentTime+.04;const g=a.createGain();g.connect(a.destination);const srcs=[];
    keys.forEach(k=>{if(k[0]==="p"){t+=+k.slice(2);return}const [st,du]=VO.clips[k];const s=a.createBufferSource();s.buffer=VO.buf;s.connect(g);s.start(t,st,du);srcs.push(s);VO.live.add(s);t+=du+.035});
    const job={srcs,done:res};VO.current=job;
    setTimeout(()=>{srcs.forEach(s=>VO.live.delete(s));res()},(t-a.currentTime)*1000+60);
  });
}
function stopVoiceover(){VO.live.forEach(s=>{try{s.stop()}catch(e){}});VO.live.clear()}
const liveUtterances=[]; // keep a reference so the browser doesn't drop the speech midway
function sayLine(text){
  return new Promise(res=>{
    const est=Math.max(1400,text.split(/\s+/).length*430*SLOW), s=window.speechSynthesis;
    if(!muted&&VO.ready){const keys=voiceKeys(text);if(keys){playClips(keys).then(res);return}}
    if(muted||!s){setTimeout(res,est);return}
    let done=false,started=false,fellBack=false;
    const fin=()=>{if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);res()};
    const local=()=>VOICES.find(v=>v.localService)||null;
    const go=v=>{
      const u=new SpeechSynthesisUtterance(text),nat=isNatural(v);
      if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
      u.rate=1;u.pitch=nat?1.05:1;
      u.onstart=()=>{started=true};u.onend=fin;
      u.onerror=()=>{if(!started&&!fellBack&&v&&!v.localService){fellBack=true;go(local())}else fin()};
      liveUtterances.push(u);if(liveUtterances.length>30)liveUtterances.shift();
      try{s.resume()}catch(e){} s.speak(u);
    };
    go(pickVoice());
    // a cloud voice that never starts gets swapped for one built into the computer
    const t2=setTimeout(()=>{if(!started&&!done&&!fellBack){const v=pickVoice();if(v&&!v.localService){fellBack=true;try{s.cancel()}catch(e){}go(local())}}},2500);
    const t1=setTimeout(fin,est*2.5+3500);
  });
}
function runTChart(root,script){
  const tc=root&&root.querySelector(".tchart"); if(!tc)return Promise.resolve();
  const T=tc.querySelector(".tcol.tens"),Oc=tc.querySelector(".tcol.ones"),cap=tc.querySelector(".tcap");
  const wait=async ms=>{await sleep(ms*SLOW);if(!tc.isConnected)throw "stop"};
  const caption=t=>{cap.innerHTML=t;cap.classList.remove("flash");void cap.offsetWidth;cap.classList.add("flash")};
  let held=null,rod=null;
  const api={
    async say(t,ms=1500){caption(t);await wait(ms)},
    // show the words and say them out loud; resolves when the voice is done
    async narrate(t,after=250){caption(t);await sayLine(plainSpeech(t));if(!tc.isConnected)throw "stop";await wait(after)},
    async add(kind,n,col){const into=kind==="rod"?T:Oc;for(let i=0;i<n;i++){const e=blockEl(kind,col);into.appendChild(e);void e.offsetWidth;e.classList.remove("in");sfx("pop");await wait(kind==="rod"?520:380)}await wait(500)},
    async glow(which,ms=1600){const c=which==="tens"?T:Oc;c.classList.add("glow");await wait(ms);c.classList.remove("glow")},
    // bundling the ten, in three beats the narration can line up with
    hold(els){held=els},
    async gather(){held=[...Oc.querySelectorAll(".cube")].slice(-10);for(const c of held){c.classList.add("pick");sfx("pop");await wait(170)}await wait(400)},
    async slideTen(){
      rod=blockEl("rod","#7C3AED");rod.classList.remove("in");rod.style.opacity="0";T.appendChild(rod);const rr=rod.getBoundingClientRect();
      held.forEach((c,i)=>{const r=c.getBoundingClientRect();c.style.transition="transform 2.25s cubic-bezier(.4,0,.2,1)";c.style.transform=`translate(${rr.left+rr.width/2-(r.left+r.width/2)}px,${rr.top+(i+.5)*rr.height/10-(r.top+r.height/2)}px) scale(.7)`});
      sfx("slide");await wait(1900)},
    async makeTen(){
      rod.style.transition="opacity .9s";rod.style.opacity="1";held.forEach(c=>{c.style.transition="opacity .9s";c.style.opacity="0"});sfx("ding");
      await wait(1000);held.forEach(c=>c.remove());held=null;await wait(300)},
    async bundle(){await this.gather();await this.slideTen();await this.makeTen()},
    // unbundling a ten, also in three beats
    async pickTen(el){rod=el||[...T.querySelectorAll(".rod")].pop();if(rod){rod.classList.add("pick");sfx("pop")}await wait(900)},
    async slideBack(){if(!rod)return;const r=rod.getBoundingClientRect(),o=Oc.getBoundingClientRect();
      rod.style.transition="transform 2.25s cubic-bezier(.4,0,.2,1)";rod.style.transform=`translate(${o.right-34-r.left}px,${o.top+8-r.top}px)`;sfx("slide");await wait(1900)},
    async breakTen(){if(!rod)return;for(let i=0;i<10;i++){const e=blockEl("cube","#F59E0B");Oc.appendChild(e);void e.offsetWidth;e.classList.remove("in");sfx("pop");if(i===5)rod.style.opacity=".3";await wait(260)}
      rod.remove();rod=null;await wait(500)},
    async unbundle(){await this.pickTen();await this.slideBack();await this.breakTen()},
    async take(kind,n){const els=[...(kind==="rod"?T:Oc).querySelectorAll(kind==="rod"?".rod":".cube")].slice(-n);
      for(const e of els){e.classList.add("out");sfx("pop");await wait(420)} await wait(900); els.forEach(e=>e.remove()); await wait(300)},
    async digits(t,o){const d=tc.querySelectorAll(".tdig");d[0].textContent=t;d[1].textContent=o;d.forEach(x=>{x.classList.remove("show");void x.offsetWidth;x.classList.add("show")});sfx("ding");await wait(1200)},
  };
  const both=(...jobs)=>Promise.all(jobs);
  return (async()=>{try{await wait(600);await script(api,both)}catch(e){if(e!=="stop")console.warn(e)}})();
}
/* Just build a number on the T-chart and point at one place. */
function tShow(n,which){const t=Math.floor(n/10),o=n%10,x=which==="tens"?t:o;return Object.assign(async(api,both)=>{
  await api.narrate(`Let's build <b>${n}</b> with blocks.`); await api.add("rod",t,"#E63946"); await api.add("cube",o,"#E63946");
  await api.narrate(`That's ${n}. ${n} is ${tensOnes(t,o)}.`);
  await both(api.narrate(`Let's count the ${which}. There ${x===1?"is":"are"} <b>${x}</b>.`),api.glow(which,2400));
  await api.digits(t,o); await api.narrate(`So ${n} has <b>${x}</b> ${which}!`,600)},{first:n})}
/* The narrated lesson a teacher would act out on the T-chart for a + b or a − b (numbers under 100).
   Red blocks are the first number, blue blocks are the number being added. */
function tScript(a,b,op){
  const a1=Math.floor(a/10),a0=a%10,b1=Math.floor(b/10),b0=b%10,sign=op==="+"?"+":"−";
  return Object.assign(async(api,both)=>{
    await api.say(`Let's lay out <b>${a}</b> in red blocks.`,300);
    await api.add("rod",a1,"#E63946"); await api.add("cube",a0,"#E63946");
    await api.narrate(`Let's solve <b>${a} ${sign} ${b}</b>.`);
    await api.narrate(`That's ${a} blocks. ${a} is ${tensOnes(a1,a0)}.`);
    if(op==="+"){
      await api.narrate(`Now, let's lay out ${b} blocks.`,0);
      await api.add("rod",b1,"#2563EB"); await api.add("cube",b0,"#2563EB");
      await api.narrate(`${b} is ${tensOnes(b1,b0)}.`);
      await api.narrate(`Now, let's add our red and blue numbers together.`);
      let o=a0+b0,t=a1+b1;
      if(o>=10){
        await both(api.narrate(`First, we <b>bundle our ones</b> to make a ten.`,0),api.gather());
        await both(api.narrate(`Once we have our ten, we can move it over to the tens column`,0),api.slideTen());
        await both(api.narrate(`and we move it over to make a ten.`,0),api.makeTen());
        o-=10; t+=1;
        await api.narrate(`Now we have <b>${tensOnes(t,o)}</b>.`);
      }else{
        await both(api.narrate(`The ones: ${a0} + ${b0} = <b>${o}</b>.`,0),api.glow("ones",1800));
        if(t>0)await both(api.narrate(`The tens: ${a1} + ${b1} = <b>${t}</b>.`,0),api.glow("tens",1800));
      }
      await both(api.narrate(`Last, we count all our tens and ones to get our answer.`,0),api.glow("tens",1800),api.glow("ones",1800));
      await api.digits(t,o);
      await api.narrate(`${tensOnes(t,o)}. ${a} + ${b} = <b>${t*10+o}</b>!`,600);
    }else{
      let t=a1,o=a0;
      await api.narrate(`We need to take away ${b}. That's ${tensOnes(b1,b0)}.`);
      if(b0>o){
        await both(api.narrate(`First, the ones. We need to take away ${b0} ones, but we only have ${o}.`,0),api.glow("ones",2200));
        await both(api.narrate(`So we <b>unbundle a ten</b>.`,0),api.pickTen());
        await both(api.narrate(`We move it over to the ones column`,0),api.slideBack());
        await both(api.narrate(`and it breaks apart into 10 ones.`,0),api.breakTen());
        t-=1; o+=10;
        await api.narrate(`Now we have <b>${tensOnes(t,o)}</b>.`);
      }
      if(b0){await both(api.narrate(`Take away ${b0} ones.`,0),api.take("cube",b0)); o-=b0}
      if(b1){await both(api.narrate(`Take away ${tenWord(b1)}.`,0),api.take("rod",b1)); t-=b1}
      await both(api.narrate(`Last, we count all our tens and ones to get our answer.`,0),api.glow("tens",1800),api.glow("ones",1800));
      await api.digits(t,o);
      await api.narrate(`${tensOnes(t,o)}. ${a} − ${b} = <b>${t*10+o}</b>!`,600);
    }
  },{first:a,second:b,op});
}

function lesson(q,focus){
  const ans=q.answer, a=q.a, b=q.b, op=q.op;
  let kind=focus; if(focus==="mix20")kind=op==="+"?"add20":"sub20";
  if(q.kind)kind=q.kind;
  const big=Math.max(a,b), small=Math.min(a,b);
  if(kind==="add5"||kind==="add10"){
    const seq=range(small).map(i=>big+i+1);
    return {title:"Ten frame + count on",html:`<div class="lrow">${box("Ten frame",tenFrame(frameCells([["a",a],["b",b]])))}${box("Count on",numberLine(0,10,ones(big,small),ans,1.2),true)}</div>`,
      steps:small===0?[`Adding 0 means nothing new joins.`,`${a} + ${b} stays <b>${ans}</b>!`]:
        [`Show <b>${a}</b> red dots and <b>${b}</b> blue dots.`,`Start at the bigger number, <b>${big}</b>. Put it in your head!`,`Count on ${small} more: ${seq.join(", ")}.`,`${a} + ${b} = <b>${ans}</b>!`]};
  }
  if(kind==="add20"){
    if(a<=10&&b<=10&&ans>10&&big<10){
      const need=10-big,rest=small-need;
      return {title:"Make a ten",html:`<div class="lrow">${box("Fill the first ten frame",`<div class="tfs">${tenFrame(frameCells([["a",big],["b",need]]))}${tenFrame(frameCells([["b",rest]]),.4+big*.12+need*.12)}</div>`)}${tchart()}</div>`,
        run:tScript(big,small,"+"),
        steps:[`<b>${big}</b> needs <b>${need}</b> more to make 10.`,`Break ${small} into ${need} and ${rest}.`,`${big} + ${need} = 10.`,`10 + ${rest} = <b>${ans}</b>!`]};
    }
    if(big>=10&&big<20&&(big%10)+small<10){
      const o=big%10;
      return {title:"Tens and ones",html:`<div class="lrow">${tchart()}${box("Count on",numberLine(Math.max(0,big-2),Math.min(20,ans+2),ones(big,small),ans,1),true)}</div>`,
        run:tScript(big,small,"+"),
        steps:[`${big} is 1 ten and ${o} ones.`,`Add the ones: ${o} + ${small} = ${o+small}.`,`1 ten and ${o+small} ones = <b>${ans}</b>!`]};
    }
    return {title:"Count on",html:`<div class="lrow">${tchart()}${box("Count on from the bigger number",numberLine(0,20,ones(big,small),ans),true)}</div>`,
      run:tScript(big,small,"+"),
      steps:[`Start at the bigger number, <b>${big}</b>.`,`Hop forward ${small}: ${range(small).map(i=>big+i+1).join(", ")}.`,`${a} + ${b} = <b>${ans}</b>!`]};
  }
  if(kind==="sub10"){
    return {title:"Take away",html:`<div class="lrow">${box("Cross them out",tenFrame(frameCells([["a",a-b],["x",b]])))}${box("Count back",numberLine(0,10,ones(a,b,-1),ans,1.5),true)}</div>`,
      steps:b===0?[`Taking away 0 takes nothing.`,`${a} − 0 stays <b>${ans}</b>!`]:
        [`Start with <b>${a}</b>.`,`Take away ${b}: cross them out.`,`Count what's left: <b>${ans}</b>.`,`${a} − ${b} = <b>${ans}</b>!`]};
  }
  if(kind==="sub20"){
    const check=`Check it: ${ans} + ${b} = ${a} ✓`;
    if(a>10&&a<20&&b<10&&b>a%10){
      const o=a%10,r=b-o;
      return {title:"Go high: get to 10 first",html:`<div class="lrow">${box(`Take ${o}, then ${r} more`,numberLine(0,20,[{from:a,to:10,label:`−${o}`},{from:10,to:ans,label:`−${r}`}],ans,1.5),true)}</div>`,
        hint:`Take away ${o} to get down to 10 first!`,
        short:[`Take away <b>${o}</b> to bring ${a} down to 10. How many more to get to ${ans}? <b>${r}</b> more!`,`${o} and ${r} make ${b}. In total we took ${b} away: ${a} − ${b} = <b>${ans}</b>!`],
        steps:[`Take away <b>${o}</b> to bring ${a} down to 10.`,`How many more do we take away to get to ${ans}? <b>${r}</b> more!`,`We took away ${o} and then ${r} more. In total, we took <b>${b}</b> away.`,`${a} − ${b} = <b>${ans}</b>!`,check]};
    }
    if(a===20&&b<10){
      return {title:"Take from a 10",html:`<div class="lrow">${box(`Take ${b} from one 10`,numberLine(0,20,[{from:a,to:ans,label:`−${b}`}],ans,1.5),true)}</div>`,
        hint:`20 is 10 and 10. Take ${b} from one of the 10s!`,
        short:[`20 is 10 and 10. Take ${b} from one 10: 10 − ${b} = <b>${10-b}</b>.`,`10 and ${10-b} make <b>${ans}</b>, so 20 − ${b} = <b>${ans}</b>!`],
        steps:[`20 is 10 and 10.`,`Take ${b} from one 10: 10 − ${b} = <b>${10-b}</b>.`,`10 and ${10-b} make <b>${ans}</b>!`,check]};
    }
    if(a>10&&b<10){
      const o=a%10;
      return {title:"Take from the top",html:`<div class="lrow">${box(`Take ${b} from the ${o}`,numberLine(0,20,[{from:a,to:ans,label:`−${b}`}],ans,1.5),true)}</div>`,
        hint:`${a} is 10 and ${o}. Take ${b} from the ${o}!`,
        short:[`${a} is 10 and ${o}. Take from the top: ${o} − ${b} = <b>${o-b}</b>.`,`10 and ${o-b} make <b>${ans}</b>, so ${a} − ${b} = <b>${ans}</b>!`],
        steps:[`${a} is 10 and ${o}.`,`Take from the top: ${o} − ${b} = <b>${o-b}</b>.`,`10 and ${o-b} make <b>${ans}</b>!`,check]};
    }
    return {title:"Count back",html:`<div class="lrow">${box("Count back",numberLine(0,20,ones(a,Math.min(b,20),-1),ans),true)}</div>`,
      steps:[`Start at <b>${a}</b>.`,`Hop back ${b}: ${range(b).map(i=>a-i-1).join(", ")}.`,`${a} − ${b} = <b>${ans}</b>!`,check]};
  }
  if(kind==="doubles"){
    return {title:"Doubles",html:box("Two groups that match",`<div class="tfs">${tenFrame(frameCells([["a",a]]))}${tenFrame(frameCells([["b",a]]),.5+a*.12)}</div>`),
      steps:[`Doubles means two groups that are exactly the same.`,`${a} red and ${a} blue.`,`Count them all: <b>${ans}</b>.`,`${a} + ${a} = <b>${ans}</b>! Doubles always make an even number.`]};
  }
  if(kind==="make10"){
    const need=10-a;
    return {title:"Ten frame",html:box("Fill the empty boxes",tenFrame([...frameCells([["a",a]]),...range(need).map(i=>"g"+(i+1))])),
      steps:[`Here are <b>${a}</b> dots.`,`Count the empty boxes: ${range(need).map(i=>i+1).join(", ")}.`,`${a} + <b>${need}</b> = 10!`]};
  }
  if(kind==="tens"){
    return {title:"Count by tens",html:`<div class="lrow">${tchart()}${box("Jump by tens",numberLine(0,100,range(b/10).map(i=>({from:a+i*10,to:a+(i+1)*10,label:"+10"})),ans,1.2),true)}</div>`,
      run:tScript(a,b,"+"),
      steps:[`${a} is ${a/10} tens. ${b} is ${b/10} tens.`,`${a/10} tens + ${b/10} tens = ${ans/10} tens.`,`${ans/10} tens = <b>${ans}</b>!`]};
  }
  if(kind==="add2"){
    const a1=Math.floor(a/10),a0=a%10,b1=Math.floor(b/10),b0=b%10;
    return {title:"Tens and ones",html:`<div class="lrow">${tchart()}${box("Line up the places",miniStack(a,b,"+",ans,null,14,{a:RED,b:BLUE}))}</div>`,
      run:tScript(a,b,"+"),
      steps:[`Ones first: ${a0} + ${b0} = <b>${a0+b0}</b>.`,`Then tens: ${a1} tens + ${b1} tens = <b>${a1+b1}</b> tens.`,`${a1+b1} tens and ${a0+b0} ones = <b>${ans}</b>!`]};
  }
  if(kind==="addre"){
    const a1=Math.floor(a/10),a0=a%10,b1=Math.floor(b/10),b0=b%10,os=a0+b0;
    return {title:"Regroup: bundle the ten",html:`<div class="lrow">${tchart()}${box("Carry the bundled ten",miniStack(a,b,"+",ans,"carry",22,{a:RED,b:BLUE}))}</div>`,
      run:tScript(a,b,"+"),
      steps:[`Ones first: ${a0} + ${b0} = <b>${os}</b>.`,`That's 10 or more, so we <b>bundle the ten</b>: 10 ones become 1 purple ten.`,`Write <b>${os-10}</b> in the ones place. The little <b>1</b> on top is the bundled ten, carried over to the tens.`,`Tens: 1 bundled ten + ${a1} + ${b1} = <b>${1+a1+b1}</b>.`,`${a} + ${b} = <b>${ans}</b>!`]};
  }
  if(kind==="subre"){
    const a1=Math.floor(a/10),a0=a%10,b1=Math.floor(b/10),b0=b%10;
    return {title:"Regroup: unbundle a ten",html:`<div class="lrow">${tchart()}${box("Borrow from the tens",miniStack(a,b,"−",ans,"borrow",24,{a:RED}))}</div>`,
      run:tScript(a,b,"−"),
      steps:[`Ones first: ${a0} − ${b0}? Not enough ones!`,`<b>Unbundle a ten</b>: 1 ten becomes 10 ones. ${a1} tens becomes <b>${a1-1}</b> tens, and ${a0} ones becomes <b>${a0+10}</b> ones.`,`Ones: ${a0+10} − ${b0} = <b>${a0+10-b0}</b>.`,`Tens: ${a1-1} − ${b1} = <b>${a1-1-b1}</b>.`,`${a} − ${b} = <b>${ans}</b>!`]};
  }
  if(kind==="mul5"||kind==="mul10"){
    const sc=range(a).map(i=>(i+1)*b);
    return {title:"Arrays + skip counting",html:box(`${a} rows of ${b}`,dotArray(a,b)),
      steps:a===1?[`1 row of ${b} is just ${b}.`,`1 × ${b} = <b>${ans}</b>!`]:
        [`${a} × ${b} means <b>${a} rows</b> with <b>${b}</b> in each row.`,`Skip count by ${b}: ${sc.join(", ")}.`,`${a} × ${b} = <b>${ans}</b>!`]};
  }
  if(kind==="skip"){
    const {seq,step}=q,hops=[...seq.slice(1),ans].map((v,i)=>({from:(i?seq[i]:seq[0]),to:v,label:`+${step}`}));
    return {title:"Look for the pattern",html:box("Same jump every time",numberLine(seq[0],ans,hops,ans),true),
      steps:[`The numbers go up by <b>${step}</b> each time.`,`${seq.join(" → ")} → ?`,`${seq[2]} + ${step} = <b>${ans}</b>!`]};
  }

        steps:[`Start at <b>${a}</b>. How far is it to <b>${sum}</b>?`,`${a} to 10 is <b>${x}</b>.`,`10 to ${sum} is <b>${y}</b>.`,`${x} + ${y} = <b>${ans}</b>, so ${a} + ${ans} = ${sum}!`]};}
    return {title:"Count up",html:box("Count up from "+a,numberLine(0,Math.max(10,sum),ones(a,ans),sum),true),

  if(kind==="tenmore"){
    const t=Math.floor(a/10),o=a%10,lo=Math.max(0,Math.min(a,ans)-10),hi=Math.max(a,ans)+10;
    return {title:`10 ${q.more?"more":"less"}`,html:`<div class="lrow">${tchart()}${box("One jump of 10",numberLine(lo,hi,[{from:a,to:ans,label:q.more?"+10":"−10"}],ans),true)}</div>`,
      run:tScript(a,10,q.more?"+":"−"),
      steps:[`${a} is ${tensOnes(t,o)}.`,`10 ${q.more?"more means add":"less means take away"} <b>1 ten</b>.`,`Only the tens digit changes: ${t} → ${q.more?t+1:t-1}. The ones stay ${o}.`,`So the answer is <b>${ans}</b>!`]};
  }
  if(kind==="placeval"){
    const n=q.n,t=Math.floor(n/10),o=n%10;
    return {title:"Tens and ones",html:`<div class="lrow">${tchart()}</div>`,run:tShow(n,q.which),
      steps:[`In ${n}, the left digit is the tens and the right digit is the ones.`,`${n} has ${t} tens (${t} rods) and ${o} ones (${o} cubes).`,`So there are <b>${ans}</b> ${q.which}!`]};
  }
  if(kind==="compare"){
    const a1=Math.floor(a/10),b1=Math.floor(b/10),a0=a%10,b0=b%10;
    return {title:"Compare tens first",html:`<div class="lrow">${box(String(a),blocks(a,"#E63946"))}${box(String(b),blocks(b,"#2563EB",.9))}</div>`,
      steps:a1!==b1?[`Compare the tens first.`,`${a} has <b>${a1}</b> tens. ${b} has <b>${b1}</b> tens.`,`${Math.max(a1,b1)} tens is more, so <b>${ans}</b> is bigger!`]:
        [`The tens are the same: ${a1} tens each.`,`So compare the ones: <b>${a0}</b> and <b>${b0}</b>.`,`${Math.max(a0,b0)} ones is more, so <b>${ans}</b> is bigger!`]};
  }
  /* ----- 2nd grade ----- */
  if(kind==="add3"){
    const n=q.nums;let pi=-1,pj=-1;for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)if(pi<0&&n[i]+n[j]===10){pi=i;pj=j}
    if(pi>=0){const c=n[3-pi-pj];
      return {title:"Find a ten pair",html:box("Make 10 first",`<div class="tfs">${tenFrame(frameCells([["a",n[pi]],["b",n[pj]]]))}${tenFrame(frameCells([["k",c]]),1.4)}</div>`),
        steps:[`Look for two numbers that make 10: <b>${n[pi]} + ${n[pj]}</b>!`,`${n[pi]} + ${n[pj]} = 10.`,`10 + ${c} = <b>${ans}</b>!`]};}
    const s=n[0]+n[1];
    return {title:"Two at a time",html:box("Add two, then the third",numberLine(0,Math.max(20,Math.ceil(ans/5)*5),[{from:0,to:n[0],label:`${n[0]}`},{from:n[0],to:s,label:`+${n[1]}`},{from:s,to:ans,label:`+${n[2]}`}],ans),true),
      steps:[`Add the first two: ${n[0]} + ${n[1]} = <b>${s}</b>.`,`Then add the third: ${s} + ${n[2]} = <b>${ans}</b>.`,`Tip: look for numbers that make 10, they're easier!`]};
  }

  }

  if(kind==="div"){
    const per=ans;
    return {title:"Share into equal groups",html:`<div class="lrow">${box(`Share ${a} into ${b} groups`,groupsHTML(b,per,(i,j)=>(j*b+i)*.16))}${box(`Skip count by ${b} to ${a}`,numberLine(0,a,range(per).map(i=>({from:i*b,to:(i+1)*b,label:`+${b}`})),a,.6),true)}</div>`,
      steps:[`${a} ÷ ${b} means share ${a} into <b>${b}</b> equal groups.`,`Deal them out one at a time, like cards.`,`Each group gets <b>${per}</b>.`,`Check: ${b} × ${per} = ${a} ✓`]};
  }
  if(kind==="missfac"){
    const sc=range(ans).map(i=>(i+1)*b);
    return {title:"Think multiplication",html:box(`Rows of ${b} until ${q.prod}`,dotArray(ans,b)),
      steps:[`How many rows of <b>${b}</b> make <b>${q.prod}</b>?`,`Skip count by ${b}: ${sc.join(", ")}.`,`That's <b>${ans}</b> rows!`,`${ans} × ${b} = ${q.prod} ✓`]};
  }
  if(kind==="multen"){
    const k=b/10;
    return {title:"Multiply by tens",html:box(`${a} groups of ${k} ten${k>1?"s":""}`,rodArray(a,k,b)),
      steps:[`${b} is <b>${k} tens</b>.`,`${a} × ${k} tens = <b>${a*k} tens</b>.`,`${a*k} tens = <b>${ans}</b>!`,`Shortcut: ${a} × ${k} = ${a*k}, then put a 0 on the end.`]};
  }
  if(kind==="round"){
    const u=q.unit,n=q.n,lo=Math.floor(n/u)*u,hi=lo+u,mid=lo+u/2,up=n>=mid;
    return {title:`Round to the nearest ${u}`,html:box("Which one is closer?",numberLine(lo,hi,[{from:n,to:ans,label:"closer!"}],ans,.8,[{v:lo,ring:true},{v:hi,ring:true},{v:mid,text:"halfway",dash:true,y:50},{v:n,text:String(n),color:"#E63946",y:76}]),true),
      steps:[`${n} is between <b>${lo}</b> and <b>${hi}</b>. Those are the two choices (circled).`,`Halfway between them is <b>${mid}</b>.`,up?`${n} is ${n===mid?"right at":"past"} halfway, so round <b>up</b>.`:`${n} is before halfway, so round <b>down</b>.`,`${n} rounds to <b>${ans}</b>!`]};
  }
  /* ----- missing number in a box ----- */
  if(kind==="blank"){
    const {form,c}=q,top=Math.max(10,Math.ceil(Math.max(a,b,c)/10)*10);
    const hopsUp=(from,n)=>n<=12?ones(from,n):[{from,to:from+n,label:`+${n}`}];
    const hopsDn=(from,n)=>n<=12?ones(from,n,-1):[{from,to:from-n,label:`−${n}`}];
    if(form==="a+?")return {title:"Count up to fill the box",html:box(`Count up from ${a} to ${c}`,numberLine(0,top,hopsUp(a,ans),c),true),

    if(form==="?+b")return {title:"Count up to fill the box",html:box(`Count up from ${b} to ${c}`,numberLine(0,top,hopsUp(b,ans),c),true),

/* Problem at the top of the lesson, with each number in the color of its blocks (first number red, added number blue). */
function paintProblem(q,run,hide){
  const ans=hide?"?":q.answer;
  if(!run)return ($("#qtext")?.outerHTML||"").replace(' id="qtext"',"");
  if(q.stack)return miniStack(q.a,q.b,q.op,ans,null,0,{a:q.a===run.first?RED:BLUE,b:q.op==="+"?(q.b===run.second?BLUE:RED):""});
  const want=[[run.first,RED]];if(run.op==="+")want.push([run.second,BLUE]);const used=want.map(()=>false);
  let h=q.html.replace(/(<[^>]*>)|(\d+)/g,(m,tag,num)=>{if(tag)return m;for(let i=0;i<want.length;i++)if(!used[i]&&want[i][0]===+num){used[i]=true;return `<span style="color:${want[i][1]}">${num}</span>`}return m});
  h=h.replace(/<span class="ans( blank)?" data-a>\?<\/span>/,(m,bl)=>`<span class="ans${bl||""}">${hide&&bl?"&nbsp;":ans}</span>`);
  return `<div class="qtext${q.small?" small":""}${q.cls?" "+q.cls:""}">${h}</div>`;
}
/* The lesson opens in its own window over the game, so nothing needs scrolling, and closes on "Got it!". */
/* Lessons are short: two lines normally, one line the second time the same kind of lesson comes up. */
function lessonLines(L,repeat){
  const st=(L.short||(L.steps||[]).filter(x=>!/^Check/.test(x)));
  if(!st.length)return [];

async function teach(p,canSkip){

  if(!skipped){lock(false);sfx("ding");$("#gotIt")?.focus({preventScroll:true});

}

function skillStats(recs){

      while(["ice","butter"].includes(M.special.get(p.node)?.t)){const nx=nbr(p.node,dir);if(nx==null||!canEnter(nx))break;await moveTo(p,nx);if(p.node===M.finish){finish(p);return}}
    }else if(sp.t==="yarn"){
      toast("🧶","Boing! A giant yarn ball tangled your wheels! That's all your moves this turn.","trap"); speakPop("Boing! A giant yarn ball tangled your wheels!"); sfx("villain"); fx(p,"trap",2200); particles(p,"🧶",5);
      G.moves=0; await sleep(1700);
    }else if(sp.t==="trike"){
      toast("🦕","A Triceratops bulldozer gave you a big push! 2 steps closer!"); speakPop("A Triceratops bulldozer gave you a big push!"); sfx("vroom"); await sleep(700); await autoMove(p,2); if(G.over)return;
    }else if(sp.t==="egg"){
      M.special.delete(p.node); $(`.spc.egg[data-n="${p.node}"]`)?.remove(); const baby=pickOne(["🦕","🦖","🐣"]);
      toast("🥚",`Crack! A dino egg hatched! A baby dino hopped on your roof! +1 move!`); speakPop("Crack! A dino egg hatched! A baby dino hopped on your roof!"); sfx("pop"); fx(p,"hop");
      p.riders.push(baby); if(p.riders.length>4)p.riders.shift(); setRiders(p); G.moves+=1; await sleep(1500);
    }else if(sp.t==="octo"){
      const [c,r]=cr(p.node), lanes=[[1,0],[-1,0],[0,1],[0,-1]].map(([dc,dr])=>[c+dc,r+dr]).filter(([x,y])=>x>=0&&y>=0&&x<M.cols&&y<M.rows).map(([x,y])=>nid(x,y)).filter(n=>!isWhale(n)&&n!==M.start&&!M.special.has(n));
      if(lanes.length){const to=Math.random()<.7?lanes.sort((a,b)=>M.dist[a]-M.dist[b])[0]:pickOne(lanes);
        toast("🐙","Scrub scrub! An octopus scrubber grabbed you and passed you to the next lane!"); speakPop("An octopus scrubber passed you to the next lane!"); sfx("squeak"); await sleep(600); await teleportTo(p,to,"fx-lift","fx-drop"); if(p.node===M.finish){finish(p);return}}
    }else if(sp.t==="bubble"){
      const [c,r]=cr(p.node), up=r>0?nid(c,r-1):null;
      if(up!=null&&!isWhale(up)){toast("🫧","Bloop bloop! A bubble stream floated you up a row!"); speakPop("A bubble stream floated you up a row!"); sfx("boing"); particles(p,"🫧",6); await sleep(500); await teleportTo(p,up,"fx-lift","fx-drop"); if(p.node===M.finish){finish(p);return}}
    }else if(sp.t==="mud"){
      toast("🟤","SPLORT! Stuck in the mud! That's all your moves this turn."); speakPop("Splort! Stuck in the mud!"); sfx("splat"); fx(p,"mud",2600); particles(p,"🟤",5);
      G.moves=0; await sleep(1500);
    }else if(sp.t==="crane"||sp.t==="trex"){
      const here=M.dist[p.node]; const opts=range(M.N).filter(n=>M.dist[n]>0&&M.dist[n]<=here-2&&M.dist[n]>=here-5&&!M.special.has(n)&&!isWhale(n));
      const rex=sp.t==="trex",msg=rex?"The T-Rex crane picked you up with its tiny arms! RAWR!":"The crane picked you up! Swinging you over the walls…";
      if(opts.length){toast(rex?"🦖":"🏗️",msg);sfx("crane");speakPop(rex?"The T-Rex crane picked you up! Rawr!":"The crane picked you up!");await sleep(500);await teleportTo(p,pickOne(opts),"fx-lift","fx-drop");}
    }else if(sp.t==="x"){
      const d=sp.d, k=d.kind;
      if(k==="slide"){
        bubble(p,d.say||"Wheee! Sliiide!"); sfx("slide");
        while(M.special.get(p.node)?.d?.kind==="slide"){const nx=nbr(p.node,dir);if(nx==null||!canEnter(nx))break;await moveTo(p,nx);if(p.node===M.finish){finish(p);return}}
      }else if(k==="stop"){
        toast(d.icon||"🛑",d.toast,"trap"); speakPop(d.say||d.toast); sfx(d.sound||"splat"); fx(p,d.fx||"trap",2400); if(d.particle)particles(p,d.particle,5);
        G.moves=0; await sleep(1500);
      }else if(k==="push"){
        toast(d.icon,d.toast); speakPop(d.say||d.toast); sfx(d.sound||"vroom"); await sleep(700); await autoMove(p,2); if(G.over)return;
      }else if(k==="bonus"){
        M.special.delete(p.node); $(`.spc.xt[data-n="${p.node}"]`)?.remove();
        toast(d.icon,d.toast); speakPop(d.say||d.toast); sfx("pop"); fx(p,"hop");
        if(d.rider){p.riders.push(d.rider); if(p.riders.length>4)p.riders.shift(); setRiders(p)}
        G.moves+=d.moves||1; await sleep(1500);
      }else if(k==="warp"){
        const here=M.dist[p.node]; const opts=range(M.N).filter(n=>M.dist[n]>0&&M.dist[n]<=here-2&&M.dist[n]>=here-5&&!M.special.has(n));
        if(opts.length){toast(d.icon,d.toast);sfx(d.sound||"warp");speakPop(d.say||d.toast);await sleep(500);await teleportTo(p,pickOne(opts),d.out||"fx-lift",d.in||"fx-drop");if(p.node===M.finish){finish(p);return}}
      }
    }else if(sp.t==="belt"){
      const nx=nbr(p.node,sp.d);
      if(nx!=null&&canEnter(nx)){bubble(p,"Conveyor belt! Whirrr!");sfx("slide");await sleep(250);await moveTo(p,nx);return landOn(p,sp.d,depth+1)}
    }
  }
  if(G.over)return;
  if(M.boosts.has(p.node)){M.boosts.delete(p.node);$(`.boost[data-n="${p.node}"]`)?.remove();
    G.moves+=2;sfx("zap");toast("⚡",`Boost! +2 ${unitWord(2)}!`);speakPop(`Boost! Two more ${unitWord(2)}!`);fx(p,"spin",1000);particles(p,"⚡",4);await sleep(900)}
  if(M.gifts.has(p.node)){M.gifts.delete(p.node);const g=$(`.gift[data-n="${p.node}"]`);if(g){g.classList.add("gone");setTimeout(()=>g.remove(),600)}await openBox(p)}
  if(!G.over&&p.kind==="human"&&M.hikers.has(p.node))await pickUp(p);
  if(!G.over&&M.truck!=null&&p.node===M.truck)await iceCream(p);
}
/* An animal waiting by the road hops on and rides along. Some of them help. */
async function pickUp(p){
  const h=M.hikers.get(p.node); M.hikers.delete(p.node);
  const el=$(`.hiker[data-n="${p.node}"]`); if(el){el.classList.add("gone");setTimeout(()=>el.remove(),600)}
  p.pals.push(h.e); setRiders(p); renderHud();
  toast(h.e,`${h.name} hitched a ride! "${h.say}"`); speakPop(`${h.name} hitched a ride! ${h.say}`); sfx("boing"); fx(p,"hop");
  await sleep(1700);
  if(h.perk==="moves")G.moves+=h.n;
  if(h.perk==="guide"){p.guide=true;bubble(p,"Gold rings show the best way now!")}
  if(h.perk==="auto")await autoMove(p,h.n);
}
async function openBox(p){
  const r=Math.random();
  if(r<.3)return chicken(p);
  if(r<.58)return applyGift(p,pickOne(BOOSTS));
  if(r<.72)return trap(p);
  return applyGift(p,pickOne(SILLY));
}
async function chicken(p){
  p.chickens++; renderHud(); setRiders(p);
  if(p.chickens>=3){
    p.chickens-=3; p.extraTurn=true; p.chickenTurns++; setRiders(p); renderHud();
    toast("🐔","CHICKEN POWER! Three rubber chickens = an EXTRA TURN!"); sfx("chickens"); speakPop("Chicken power! Three rubber chickens! You get an extra turn!");
    particles(p,"🐔",6); fx(p,"hop");
  }else{
    toast("🐔",`A rubber chicken! SQUEAK! That's ${p.chickens} of 3. Get 3 for an extra turn!`); sfx("squeak"); speakPop(`A rubber chicken! That's ${p.chickens}.`); fx(p,"hop");
  }
  await sleep(1700);
}
async function trap(p){
  const t=pickOne(TRAPS); p.traps++; renderHud();
  toast("🎩",t,"trap"); sfx("villain"); speakPop(t); fx(p,"trap",2400); particles(p,pickOne(["🧶","🐱","😼"]),6);
  G.moves=0; await sleep(2300);
}
async function applyGift(p,s){
  toast(s.e,s.t); speakPop(s.t); sfx(s.sound||"boing");
  if(s.fx==="mud"){fx(p,"mud",2600)}else if(s.fx==="shine"){fx(p,"shine",2600)}else if(s.fx)fx(p,s.fx);
  if(s.parts)particles(p,s.parts,7);
  if(s.rider){await sleep(400);p.riders.push(s.rider);if(p.riders.length>4)p.riders.shift();setRiders(p)}
  if(s.moves)G.moves+=s.moves;
  await sleep(1500);
  if(s.auto)await autoMove(p,s.auto);
  if(s.warp)await warp(p);
}
async function autoMove(p,k){
  for(let i=0;i<k&&!G.over;i++){let m=null;for(const x of M.adj[p.node])if(M.dist[x]<M.dist[p.node]&&(m==null||isBlock(m)))m=x;if(m==null)break;
    if(isBlock(m)){bubble(p,stopWhy(m));await sleep(900);break}
    if(p.kind==="bot"&&isRed(m)){bubble(p,"Snoozy waits. "+stopWhy(m)+" Yawn.");await sleep(900);break}
    await moveTo(p,m);if(p.node===M.finish){finish(p);return}}
}
async function warp(p){
  const here=M.dist[p.node];
  const opts=range(M.N).filter(n=>M.dist[n]>0&&M.dist[n]<here-1&&M.dist[n]>=here-8&&!M.special.has(n));
  if(!opts.length){await autoMove(p,1);return}
  sfx("warp"); await teleportTo(p,pickOne(opts),"fx-warp","fx-unwarp");
}
async function afterTurn(p){
  $("#layer").querySelectorAll(".tgt").forEach(e=>e.remove());
  G.humanTurns++;
  if(p.extraTurn&&!G.over){
    p.extraTurn=false; toast("🐔","Extra turn! Bawk bawk! Go again!"); speakPop("Extra turn! Go again!"); await sleep(1600);
    if(G.over)return; beginTurn(); return;
  }
  const bot=G.players.find(x=>x.kind==="bot");
  if(bot&&!G.over){
    $("#leftBody").innerHTML=`<div class="waiting">Snoozy's turn… 😴</div>`; $("#answerArea").innerHTML="";
    await sleep(500); await botTurn(bot); if(G.over)return;
  }
  const hs=humans(); const nx=hs[(hs.indexOf(p)+1)%hs.length];
  if(hs.indexOf(nx)===0){G.round++;updateLights();if(M.cones)moveCones(false)}
  moveTruck(R(1,2));
  if(SET.world==="build"&&G.humanTurns%3===1&&!G.over){toast("💥","CRASH! The wrecking ball smashed a wall! New shortcut!");speakPop("Crash! The wrecking ball smashed a wall! New shortcut!");smashWalls(R(1,2));await sleep(1900)}
  if(G.humanTurns%3===0)spawnGifts(R(1,2));
  if(G.humanTurns%4===2)spawnHiker();
  moveWhales();
  if(SET.world==="pancake"&&G.humanTurns%4===0){toast("🍳","The giant spatula flipped the road! FLIP! Some walls moved!");speakPop("The giant spatula flipped the road!");reshapeMaze(3);await sleep(1800)}
  G.turn=G.players.indexOf(nx); await sleep(300); beginTurn();
}
async function botTurn(b){
  follow(b);
  if(b.skip){b.skip--;bubble(b,"Nom nom… hot dogs…");await sleep(1500);return}
  const r=Math.random();
  if(r<.16){bubble(b,pickOne(SNOOZY_LINES));particles(b,"💤",3);await sleep(1700);return}
  const k=r<.55?1:r<.88?2:3;
  if(k===3)bubble(b,"Snoozy sneezed himself forward! ACHOO!");
  await autoMove(b,k); await sleep(400);
}
function critter(){
  if(G.over||$("#race").hidden)return;
  const n=R(0,M.N-1);
  const d=document.createElement("span");d.className="critter"+(Math.random()<.5?" rtl":"");d.textContent=pickOne(W().critters);
  d.style.top=`calc(${pctY(n)} + ${R(-8,8)}px)`;
  $("#layer").appendChild(d);setTimeout(()=>d.remove(),10500);
}

/* =================== FINISH + PARADE =================== */
function finish(p){
  if(G.over)return;
  G.over=true; G.phase="done"; clearInterval(G.critterT);
  const d=G.driveDone; G.driveDone=null; d&&d();
  humans().forEach(h=>earn(h,h===p?(SET.mode==="bot"?20:15):5));
  renderHud(); speakPop(p.kind==="human"?`${p.name} made it!`:"Snoozy rolled up to the trophy!"); toast("🏆",p.kind==="human"?`${p.name} made it to ${M.kind==="graph"?M.names[M.finish]:"the trophy"}!`:"Snoozy rolled up to the trophy!");
  setTimeout(()=>parade(p),1200);
}
function parade(p){
  const human=p.kind==="human"; const v=vehicle(p.veh); const P=$("#parade"); const w=W();
  const crowd=shuffle(["🧒","👧🏾","👦🏻","👩‍🦱","🧑🏽","👴","👵🏿","🐶","🐱","🧑‍🦰","👨🏿","🐸","🦖","🐄"]).slice(0,10);
  const chick=humans().reduce((s,h)=>s+h.chickens+h.chickenTurns*3,0), pals=humans().flatMap(h=>h.pals||[]);
  const floats=human?[
    `<span class="emo">🦆</span>`,`<span class="emo">🐥</span>`,`<span class="emo">🐥</span>`,
    `<div class="float"><span class="emo">🎩😾</span><span class="deck">GRUMPY MAYOR</span></div>`,
    ...w.floats.map(([e,t])=>`<div class="float"><span class="emo">${e}</span><span class="deck">${esc(t)}</span></div>`),
    `<div class="float"><span class="emo">${"🐔".repeat(Math.min(5,Math.max(1,chick)))}</span><span class="deck">CHICKEN SQUAD</span></div>`,
    ...(pals.length?[`<div class="float"><span class="emo">${pals.slice(0,6).join("")}</span><span class="deck">ANIMAL FRIENDS</span></div>`]:[]),
    ...((p.gear&&p.gear.floats)||[]).map(f=>`<div class="float"><span class="emo">${f.e}</span><span class="deck">${esc(f.n.toUpperCase())}</span></div>`),
    `<div class="float"><span class="emo">🎈🎈🎈</span><span class="deck">BALLOONS</span></div>`,
    `<div class="float"><span class="emo">🏆</span><span class="deck">${esc(p.name)} WINS!</span></div>`,
  ]:[`<div class="float"><span class="emo">🌭</span><span class="deck">HOT DOGS</span></div>`,`<span class="emo">💤</span>`];
  const where=M.kind==="graph"?M.names[M.finish]:w.name;
  P.innerHTML=`<canvas id="fw"></canvas>
    <div class="pbanner">${human?`HOORAY FOR ${esc(p.name).toUpperCase()}!`:"SNOOZY WINS!"}<small>${human?"The "+esc(v.name)+" victory parade at "+esc(where):"(shhh… he's still sleeping)"}</small></div>
    <div class="pcity"><svg viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${skyline()}</svg></div>
    <div class="proad"></div>
    <div class="ptrain">${floats.join("")}<div class="pv"><div class="riders">${riderList(p).map(r=>`<span>${r}</span>`).join("")}</div>${v.svg}</div><span class="emo">🥁</span><span class="emo">🎺</span><span class="emo">🎉</span></div>
    <div class="pcrowd">${crowd.map(c=>`<span>${c}</span>`).join("")}</div>
    <button type="button" class="chunk pskip" id="pskip">Skip</button>`;
  P.hidden=false;
  if(human){sfx("parade");playClip("parade").then(ok=>{if(!ok)speakNow(`Hooray for ${p.name}! Hip hip hooray!`,true)});fireworks(12000)}else{sfx("sad");speakNow("Snoozy wins! Shhh, he's still sleeping. Want a rematch?",true)}
  const t=setTimeout(()=>endCard(p),12200);
  $("#pskip").onclick=()=>{clearTimeout(t);endCard(p)};
}
function endCard(p){
  const P=$("#parade"); if(P.hidden)return; P.querySelector(".endcard")?.remove(); P.querySelector("#pskip")?.remove();
  const human=p.kind==="human", hs=humans();
  P.insertAdjacentHTML("beforeend",`<div class="card endcard">
    <div class="big">${human?(hs.length>1?esc(p.name)+" wins!":"You win!"):"Snoozy won this time!"}</div>
    <div>${human?"🏆 First to the finish!":"Snoozy is so surprised it almost woke up. Rematch?"}</div>
    <div class="stats">${hs.map(h=>`<span>${esc(h.name)}: ${h.correct} right out of ${h.asked} · 🐔 ${h.chickens+h.chickenTurns*3} chickens${h.traps?` · escaped ${h.traps} Humdinger trap${h.traps>1?"s":""}`:""}${h.pals.length?` · gave rides to ${h.pals.join(" ")}`:""}${h.riders.length?` · picked up ${h.riders.join(" ")}`:""}</span>`).join("")}</div>
    <div class="stats">${hs.map(h=>`<span>🪙 ${esc(h.name)} earned <b>${h.earned||0}</b> coins (now ${wallet(h.name).coins})</span>`).join("")}</div>
    <div class="row"><button type="button" class="chunk go" id="againBtn">Race again!</button><button type="button" class="chunk" id="shop2">🏆 Prize Shop</button><button type="button" class="chunk" id="replayBtn">Watch the parade again</button><button type="button" class="chunk" id="garage2">Change world, ride or math</button></div></div>`);
  $("#againBtn").onclick=()=>{P.hidden=true;startRace()};
  $("#replayBtn").onclick=()=>parade(p);
  $("#garage2").onclick=toGarage;
  $("#shop2").onclick=()=>openShop(hs[0]&&hs[0].name);
  $("#againBtn").focus();
}
function skyline(){let s="",x=0;const cols=["#3B2F6B","#4B3A7E","#2E2558","#55448C"];while(x<1200){const w=R(60,110),h=R(70,190);s+=`<rect x="${x}" y="${200-h}" width="${w}" height="${h}" fill="${pickOne(cols)}"/>`;for(let wy=200-h+12;wy<190;wy+=22)for(let wx=x+10;wx<x+w-12;wx+=20)if(Math.random()<.6)s+=`<rect x="${wx}" y="${wy}" width="9" height="10" fill="#FFE48A"/>`;x+=w+R(2,10)}return s}
function fireworks(ms){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#fw"); if(!c)return; const x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#FFD23F","#E63946","#4CC9F0","#B5179E","#80ED99","#fff"]; let parts=[]; const t0=performance.now(); let last=0;
  (function f(t){if(!document.body.contains(c))return;
    if(t-last>420&&t-t0<ms-1200){last=t;const cx=R(c.width*.1,c.width*.9),cy=R(c.height*.08,c.height*.45),col=pickOne(cols);
      for(let i=0;i<46;i++){const a=Math.PI*2*i/46,v=2+Math.random()*3.2;parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,col})}if(!muted)tone(R(80,140),.3,"sine",.12,0,40)}
    x.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=.013;x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.col;x.fillRect(p.x,p.y,3.5,3.5)});
    parts=parts.filter(p=>p.l>0); x.globalAlpha=1;
    if(t-t0<ms)requestAnimationFrame(f);})(t0);
}
function toGarage(){
  G.over=true;G.phase="idle";clearInterval(G.critterT);try{speechSynthesis.cancel()}catch(e){}
  $("#parade").hidden=true;$("#parade").innerHTML="";$("#race").hidden=true;$("#setup").hidden=false;$("#garageBtn").hidden=true;renderSetup();
}
$("#garageBtn").onclick=toGarage;
$("#startBtn").onclick=startRace;
renderSetup(); loadVoices();
})();
</script>
